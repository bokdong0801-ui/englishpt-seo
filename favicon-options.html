<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ENGLISH PT 파비콘 비교</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><style>body{margin:0;background:#f6f3eb;color:#101915;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:0 auto;padding:48px 20px}h1{font-size:34px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px}.card{background:#fff;border:1px solid #ddd8ca;border-radius:18px;padding:24px;text-align:center}.card img{width:96px;height:96px}.mini{display:flex;justify-content:center;gap:10px;margin:18px 0}.mini img{width:32px;height:32px}.tag{display:inline-block;background:#2C5E49;color:white;border-radius:999px;padding:5px 10px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>ENGLISH PT 파비콘 4안</h1><p>브라우저 탭에서 작게 보이는 상황을 기준으로 단순성과 식별력을 비교했습니다.</p><div class="grid"><article class="card"><img src="/assets/favicon-a.svg"><h2>A. 원형 PT</h2><div class="mini"><img src="/assets/favicon-a.svg"><img src="/assets/favicon-a.svg"></div><p>현재형. 안정적이지만 16px에서는 원 테두리와 글자가 조금 작아집니다.</p></article><article class="card"><span class="tag">추천</span><br><img src="/assets/favicon-b.svg"><h2>B. 굵은 PT</h2><div class="mini"><img src="/assets/favicon-b.svg"><img src="/assets/favicon-b.svg"></div><p>딥그린 배경에 PT만 크게 배치해 작은 크기에서도 가장 선명합니다.</p></article><article class="card"><img src="/assets/favicon-c.svg"><h2>C. P + 포인트</h2><div class="mini"><img src="/assets/favicon-c.svg"><img src="/assets/favicon-c.svg"></div><p>브랜드 포인트는 강하지만 PT라는 이름 전달력은 B보다 낮습니다.</p></article><article class="card"><img src="/assets/favicon-d.svg"><h2>D. E 배지</h2><div class="mini"><img src="/assets/favicon-d.svg"><img src="/assets/favicon-d.svg"></div><p>영어 느낌은 있으나 ENGLISH PT 고유성은 가장 약합니다.</p></article></div></main></body></html>
