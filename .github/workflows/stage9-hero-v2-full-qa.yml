              'station-gangnam.html',
              'station-amsayeoksagongwon.html',
              'seoul-jongno-sajikdong-worker-english-conv-academy.html',
          ]
          for name in samples:
              p=src/name
              assert p.exists(), name

          shutil.copytree(src/'assets',out/'assets')
          if (src/'pilot.css').exists(): shutil.copy2(src/'pilot.css',out/'pilot.css')
          if (src/'pilot.js').exists(): shutil.copy2(src/'pilot.js',out/'pilot.js')

          sample_set=set(samples)
          for name in samples:
              raw=(src/name).read_text(encoding='utf-8')
              raw=re.sub(r'(["\'])/assets/',r'\1assets/',raw)
              raw=re.sub(r'(["\'])/pilot\.css',r'\1pilot.css',raw)
              raw=re.sub(r'(["\'])/pilot\.js',r'\1pilot.js',raw)
              for target in samples:
                  raw=raw.replace(f'href="/{target}"',f'href="{target}"')
              (out/name).write_text(raw,encoding='utf-8')

          labels={
              'englishpt.html':'메인',
              'seoul-jongno-sajikdong-beginner-english-conv.html':'사직동 왕초보영어회화',
