name: Stage 9 Hero V2 Full 140391 QA (No Deploy)

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - '.github/workflows/stage9-hero-v2-full-qa.yml'

permissions:
  contents: read
  actions: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk
          python -m pip install --quiet pillow
          python -m py_compile scripts/build-stage9-production-release.py
          python -m py_compile scripts/stage9-clean-mass-renderer.py
          python -m py_compile scripts/stage9_hero_copy.py
          python -m unittest discover -s scripts -p 'test_stage9_hero_copy.py' -v
          python scripts/test_stage9_hero_integration.py
          python -m py_compile scripts/stage9-station-renderer.py
          python -m py_compile scripts/stage9-square-search-thumbnails.py
          python -m py_compile scripts/stage9-copy-quality-qa.py
          python -m py_compile scripts/build-locality-index.py
          node --check assets/site.js

      - name: Download approved Stage 7 source
        uses: actions/download-artifact@v4
        with:
          name: stage7-deploy-preview-rollback
          path: stage7-source
          run-id: 36694432423
          github-token: ${{ github.token }}

      - name: Download approved Stage 8 packet
        uses: actions/download-artifact@v4
        with:
          name: stage8-production-approval-packet
          path: stage8-source
          run-id: 36694845460
          github-token: ${{ github.token }}

      - name: Extract proven source pages
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          rm -rf stage9-work stage9-release final-review
          mkdir -p stage9-work
          mapfile -t PKGS < <(find stage7-source -name 'stage5-shard-*-of-026.tar.zst' | sort)
          test "${#PKGS[@]}" -eq 26
          for f in "${PKGS[@]}"; do tar --zstd -xf "$f" -C stage9-work; done
          test "$(find stage9-work/stage5-full-generation -name '*.html' | wc -l)" -eq 66937

      - name: Assemble current 140391-page release
        run: |
          python3 scripts/build-stage9-production-release.py             --stage7-root stage7-source/stage7-preview             --stage8-root stage8-source             --work-root stage9-work             --output stage9-release

      - name: Similarity QA
        run: |
          python3 scripts/stage9-clean-similarity-qa.py             --root stage9-release             --samples-per-intent 60             --output stage9-release/STAGE9_CLEAN_SIMILARITY_QA_V1.json

      - name: Beginner readability QA
        run: |
          python3 scripts/qa-beginner-readability.py stage9-release             --report STAGE9_BEGINNER_READABILITY_QA.json

      - name: Copy repetition and bug QA
        run: |
          python3 scripts/stage9-copy-quality-qa.py             --root stage9-release             --output stage9-release/STAGE9_COPY_QUALITY_QA.json

      - name: Full information architecture and SEO gate
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          root=Path('stage9-release')
          report=json.loads((root/'STAGE9_PRODUCTION_RELEASE_QA_V1.json').read_text(encoding='utf-8'))
          assert report['status']=='PASS_STAGE9_RELEASE_ASSEMBLED_READY_TO_DEPLOY',report
          assert report['counts']['html_total']==140391
          assert report['counts']['station_hubs']==911
          assert report['counts']['station_course_pages']==20953
          assert report['counts']['sitemap_urls']==21964
          assert report['indexing']['indexable_pages']==21964
          assert report['indexing']['noindex_pages']==118427
          assert report['indexing']['production_ui_failures']==0

          search=report['counts']['search_image_metadata']
          assert search['square_size']=='1200x1200',search
          assert search['missing_assets']==0,search
          assert search['manifest_missing']==0,search
          assert search['schema_failures']==0,search
          assert search['body_search_thumbnail_policy']=='metadata_only',search
          assert search['unique_search_images']>=29,search

          files={p.name for p in root.glob('*.html') if p.name!='404.html'}
          assert len(files)==140391,len(files)
          assert (root/'404.html').exists()
          assert (root/'privacy/index.html').exists()
          assert (root/'assets/favicon.svg').exists()
          assert (root/'assets/locality-index.json').exists()
          localities=json.loads((root/'assets/locality-index.json').read_text(encoding='utf-8'))
          assert len(localities)==5149,len(localities)

          core=['englishpt.html','courses.html','english-conversation.html','exam-english.html','student-english.html']
          for name in core:
              raw=(root/name).read_text(encoding='utf-8')
              assert 'data-region-finder' in raw,name
              assert 'data-region-sido' in raw and 'data-region-jurisdiction' in raw and 'data-region-dong' in raw,name
              assert '영어권 교포 선생님' in raw,name
          for name in core:
              raw=(root/name).read_text(encoding='utf-8')
              assert '무료 PT 진단' not in raw,name
              assert '체험수업 신청' in raw,name
              assert 'data-phone-toggle' in raw,name
              assert 'id="header-phone-popover"' in raw,name
              assert 'href="tel:+821050068027"' in raw,name

          home=(root/'englishpt.html').read_text(encoding='utf-8')
          assert '전체지역·과정 바로가기' in home
          assert '누구를 위한' in home
          assert home.index('과정 찾기') < home.index('전체지역·과정 바로가기')

          # Search thumbnail contract: metadata only, never visible body content.
          from PIL import Image
          metadata_samples=core+[
              'seoul-jongno-buamdong-toeic.html',
              'seoul-jongno-sajikdong-ielts.html',
              'seoul-jongno-sajikdong-beginner-english-conv.html',
              'seoul-jongno-hyehwadong-worker-english-conv-academy.html',
          ]
          for name in metadata_samples:
              raw=(root/name).read_text(encoding='utf-8')
              assert 'og:image:width" content="1200"' in raw,name
              assert 'og:image:height" content="1200"' in raw,name
              assert 'og:image:alt' in raw,name
              assert 'thumbnailUrl' in raw,name
              assert 'class="visual-break"' not in raw,name
              assert 'class="learning-visual"' not in raw,name
              assert 'search-thumbnail-section' not in raw,name
              m=re.search(r'<meta property="og:image" content="https://englishpt\.kr(/assets/images/[^"]+)">',raw)
              assert m,(name,'og image')
              image_path=root/m.group(1).lstrip('/')
              assert image_path.exists(),(name,image_path)
              with Image.open(image_path) as im:
                  assert im.size==(1200,1200),(name,im.size)

          # Floating phone/trial conversion controls + FAQ depth on detailed course pages.
          conversion_samples={
              'seoul-jongno-sajikdong-beginner-english-conv.html':4,
              'seoul-jongno-buamdong-toeic.html':5,
              'seoul-jongno-sajikdong-ielts.html':5,
              'seoul-jongno-sajikdong-ielts-academy.html':6,
          }
          for name,faq_target in conversion_samples.items():
              raw=(root/name).read_text(encoding='utf-8')
              assert 'class="mid-consult-cta"' not in raw,(name,'old mid CTA')
              assert raw.count('class="floating-contact"')==1,(name,'floating contact')
              assert 'href="tel:+821050068027"' in raw,(name,'phone CTA')
              assert 'data-trial-cta' in raw,(name,'trial CTA')
              assert 'name="requestType" value="체험수업 신청"' in raw,(name,'request type')
              faq=re.search(r'<div class="faq">(.*?)</div>',raw,re.S)
              assert faq,(name,'FAQ')
              faq_count=len(re.findall(r'<details>.*?</details>',faq.group(1),re.S))
              assert faq_count==faq_target,(name,faq_count,faq_target)

          intent_faq_targets={
              'elem-tutor':4,'mid-conv':4,'high-conv':4,'univ-conv':4,
              'jobseeker-conv':5,'biz-business-conv':5,'housewife-conv':4,
              'toeic':5,'toeic-speaking':5,'opic':5,'ielts':5,'duolingo':5,'toefl':5,
              'toeic-academy':6,'toeic-speaking-academy':6,'opic-academy':6,
              'ielts-academy':6,'duolingo-academy':6,'toefl-academy':6,
              'english-conv-academy':5,'adult-english-conv-academy':5,
              'worker-english-conv-academy':5,'beginner-english-conv':4,
          }
          for intent,target in intent_faq_targets.items():
              name=f'seoul-jongno-sajikdong-{intent}.html'
              raw=(root/name).read_text(encoding='utf-8')
              faq=re.search(r'<div class="faq">(.*?)</div>',raw,re.S)
              assert faq,(name,'FAQ missing')
              count=len(re.findall(r'<details>.*?</details>',faq.group(1),re.S))
              assert count==target,(name,count,target)
              assert '오류가 줄었는지는 어떻게 보나요?' not in raw,name
              assert '변화는 어떻게 확인하나요?' not in raw,name
              assert '교재 진도보다 실제 상황을 먼저 보나요?' not in raw,name
              assert '수업 기록은 얼마나 자세해야 하나요?' not in raw,name
              assert '무료 PT 진단' not in raw,name
              assert '체험수업 신청' in raw,name
              assert 'data-phone-toggle' in raw,name
              assert 'id="header-phone-popover"' in raw,name

          # 911 station hubs -> all 23 existing course pages.
          station_data=json.loads(Path('data/stations.json').read_text(encoding='utf-8'))
          station_course_checks=0
          for row in station_data['stations']:
              hub=root/f'station-{row["slug"]}.html'
              assert hub.exists(),hub.name
              raw=hub.read_text(encoding='utf-8')
              assert 'station-hub-page' in raw,hub.name
              assert '무료 PT 진단' not in raw,hub.name
              assert '체험수업 신청' in raw,hub.name
              assert 'data-phone-toggle' in raw,hub.name
              assert 'id="header-phone-popover"' in raw,hub.name
              assert 'teacher-trust' in raw and '한국어' in raw,hub.name
              prefix=f'station-{row["slug"]}-'
              hrefs=set(re.findall(r'href="/(station-[^"]+\.html)"',raw))
              courses={x for x in hrefs if x.startswith(prefix)}
              assert len(courses)==23,(hub.name,len(courses))
              missing=[x for x in courses if x not in files]
              assert not missing,(hub.name,missing[:5])
              station_course_checks+=len(courses)
          assert station_course_checks==911*23,station_course_checks

          # All current generated locality pages -> 22 sibling courses + valid nearby localities.
          clean_pages=0
          sibling_checks=0
          nearby_page_count=0
          canonical_set=set()
          indexable_urls=set()
          noindex_count=0
          for p in root.glob('*.html'):
              if p.name=='404.html':
                  continue
              raw=p.read_text(encoding='utf-8',errors='ignore')
              cm=re.search(r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)["\']',raw,re.I)
              assert cm,(p.name,'canonical')
              canonical=cm.group(1)
              assert canonical not in canonical_set,(p.name,'duplicate canonical')
              canonical_set.add(canonical)
              rm=re.search(r'<meta name="robots" content="([^"]+)">',raw,re.I)
              assert rm,(p.name,'robots')
              tokens={x.strip().lower() for x in rm.group(1).split(',')}
              if 'noindex' in tokens: noindex_count+=1
              else: indexable_urls.add(canonical)

              if 'data-stage9-clean="true"' not in raw or p.name.startswith('station-'):
                  continue
              clean_pages+=1
              assert 'local-navigation' in raw,p.name
              marker='<section class="section related local-navigation">'
              nav=raw.split(marker,1)[1].split('</section>',1)[0]
              assert '같은 지역 · 다른 과정' in nav,p.name
              course_links=set(re.findall(r'href="/([^"]+\.html)"',nav))
              assert len(course_links)==22,(p.name,len(course_links))
              for x in course_links:
                  assert x in files,(p.name,x)
              sibling_checks+=len(course_links)
              if 'class="section nearby-localities"' in raw:
                  nearby_page_count+=1
                  near_block=raw.split('<section class="section nearby-localities">',1)[1].split('</section>',1)[0]
                  assert '전체 과정 찾기' in near_block and '911개 역으로 찾기' in near_block,p.name
                  for x in set(re.findall(r'href="/([^"]+\.html)"',near_block)):
                      if x not in {'courses.html','stations.html','englishpt.html'}:
                          assert x in files,(p.name,x)

          assert len(canonical_set)==140391,len(canonical_set)
          assert len(indexable_urls)==21964,len(indexable_urls)
          assert noindex_count==118427,noindex_count
          assert clean_pages==118427,clean_pages
          assert sibling_checks==118427*22,sibling_checks

          groups={}
          for row in localities: groups[row['jurisdiction']]=groups.get(row['jurisdiction'],0)+1
          expected_nearby=sum(23 for row in localities if groups[row['jurisdiction']]>1)
          assert nearby_page_count==expected_nearby,(nearby_page_count,expected_nearby)

          # Legacy Songhyeondong pages are now connected to the current 23-course graph.
          preserved=root/'dalseo-songhyeondong-adult-conv.html'
          assert preserved.exists()
          pr=preserved.read_text(encoding='utf-8')
          assert 'preserved-region-navigation' in pr
          assert '같은 지역 · 다른 과정' in pr
          song_links=set(re.findall(r'href="/(daegu-dalseo-songhyeondong-[^"]+\.html)"',pr))
          assert len(song_links)>=23,len(song_links)
          assert all(x in files for x in song_links),[x for x in song_links if x not in files][:5]

          # Representative current Songhyeondong/Sajikdong pages expose continuation navigation.
          reps=[
              'daegu-dalseo-songhyeondong-toeic.html',
              'seoul-jongno-sajikdong-toeic.html',
              'seoul-jongno-sajikdong-worker-english-conv-academy.html'
          ]
          for name in reps:
              p=root/name; assert p.exists(),name
              raw=p.read_text(encoding='utf-8')
              assert 'local-navigation' in raw,name
              assert '같은 지역 · 다른 과정' in raw,name
              assert '다른 동네' in raw,name
              assert '영어권 시민권 교포 선생님 · 현지 발음' in raw,name

          sitemap_urls=set()
          for shard in (root/'sitemaps').glob('sitemap-*.xml'):
              sitemap_urls.update(re.findall(r'<loc>(.*?)</loc>',shard.read_text(encoding='utf-8')))
          assert sitemap_urls==indexable_urls,(len(sitemap_urls),len(indexable_urls))

          print('PASS_FINAL_IA_RELEASE_GATE',json.dumps({
              'html':len(files),
              'station_hubs':911,
              'station_course_links':station_course_checks,
              'clean_locality_pages':clean_pages,
              'sibling_course_links':sibling_checks,
              'pages_with_nearby_links':nearby_page_count,
              'localities':len(localities),
              'indexable':len(indexable_urls),
              'noindex':noindex_count,
              'songhyeondong_links':len(song_links)
          },ensure_ascii=False))
          PY

      - name: Hero V2 full-release content and pressure vocabulary QA
        run: |
          python3 - <<'PY'
          import json,re,html
          from pathlib import Path
          root=Path('stage9-release')
          report=json.loads((root/'STAGE9_PRODUCTION_RELEASE_QA_V1.json').read_text(encoding='utf-8'))
          counts=report['counts']
          assert counts['html_total']==140391,counts
          image_qa=counts['search_image_metadata']
          for key in ('visible_body_image_pages','missing_local_assets','missing_local_html','html_structure_failures'):
              assert image_qa[key]==0,(key,image_qa[key])
          mass=0; station_courses=0; station_hubs=0; beginners=0; errors=[]
          pressure=('훈련','진단','실전','교정','병목','재점검','재검증')
          for p in root.glob('*.html'):
              n=p.name
              if n=='404.html':
                  continue
              raw=p.read_text(encoding='utf-8',errors='replace')
              if 'data-stage9-clean="true"' in raw:
                  if ('data-hero-copy="audience-v2"' not in raw
                      or 'class="hero-next-grid"' not in raw
                      or 'href="#consultation-preview"' not in raw):
                      errors.append((n,'audience-hero-contract'))
                  if re.search(r'<h1\b',raw,re.I) is None:
                      errors.append((n,'missing-h1'))
                  if n.startswith('station-'): station_courses+=1
                  else: mass+=1
              elif re.fullmatch(r'station-[^.]+\.html',n):
                  station_hubs+=1
                  if ('class="section soft hero-entry-panel"' not in raw
                      or 'href="/station-' not in raw):
                      errors.append((n,'station-audience-choices'))
              if n.endswith('-beginner-english-conv.html') or n=='englishpt.html':
                  visible=raw.split('</head>',1)[-1]
                  visible=re.sub(r'<script\b.*?</script>|<style\b.*?</style>|<[^>]+>',' ',visible,flags=re.S|re.I)
                  visible=html.unescape(visible)
                  # Whole-term only: 병목안동 is a valid place name, not the word 병목.
                  pressure_found=[
                      x for x in pressure
                      if re.search(r'(?<![가-힣A-Za-z0-9])' + re.escape(x) + r'(?![가-힣A-Za-z0-9])', visible)
                  ]
                  if pressure_found: errors.append((n,'pressure-terms',pressure_found))
                  beginners+=1
              if len(errors)>=40: break
          assert not errors,errors[:20]
          assert mass==118427,(mass,118427)
          assert station_courses==20953,(station_courses,20953)
          assert station_hubs==911,(station_hubs,911)
          assert beginners==6061,(beginners,6061)
          result={
              'status':'PASS_HERO_V2_FULL_RELEASE_QA',
              'html_total':counts['html_total'],
              'locality_course_hero_pages':mass,
              'station_course_hero_pages':station_courses,
              'station_hub_audience_pages':station_hubs,
              'beginner_and_main_pressure_pages_checked':beginners,
              'visible_body_image_pages':image_qa['visible_body_image_pages'],
              'missing_local_assets':image_qa['missing_local_assets'],
              'missing_local_html':image_qa['missing_local_html'],
              'html_structure_failures':image_qa['html_structure_failures'],
              'production_deployed':False
          }
          (root/'STAGE9_HERO_V2_FULL_QA.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY

      - name: Build complete 140391-page review package
        run: |
          set -euo pipefail
          rm -rf final-review
          cp -a stage9-release final-review
          cp final-review/englishpt.html final-review/index.html

          cat > final-review/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
          EOF

          python3 - <<'PY'
          import re,json
          from pathlib import Path
          root=Path('final-review')
          pages=[p for p in root.glob('*.html') if p.name not in {'404.html','index.html'}]
          assert len(pages)==140391,len(pages)
          assert (root/'404.html').exists()
          assert (root/'index.html').exists()
          assert (root/'assets/locality-index.json').exists()
          assert len(json.loads((root/'assets/locality-index.json').read_text(encoding='utf-8')))==5149

          # Regression for the exact 404 found during manual review:
          # Sajik-dong beginner English conversation -> Buam-dong.
          source=root/'seoul-jongno-sajikdong-beginner-english-conv.html'
          target=root/'seoul-jongno-buamdong-beginner-english-conv.html'
          assert source.exists(),source.name
          assert target.exists(),target.name
          raw=source.read_text(encoding='utf-8')
          assert 'seoul-jongno-buamdong-beginner-english-conv.html' in raw

          # Every root-relative HTML link from the reviewed page must resolve in the full package.
          hrefs=set(re.findall(r'href=["\']/([^"\'#?]+\.html)',raw))
          missing=[x for x in hrefs if not (root/x).exists()]
          assert not missing,missing[:20]

          print('PASS_FULL_REVIEW_PACKAGE',len(pages),'SAJIK_TO_BUAM_OK',target.name,'LINKS',len(hrefs))
          PY

      - name: Chromium desktop and mobile QA
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pychrome
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 8777 --directory final-review >/tmp/final-review-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars             --remote-debugging-port=9237 --remote-allow-origins='*'             --user-data-dir=/tmp/final-ia-chrome about:blank >/tmp/final-ia-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$SERVER_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9237/json/version >/dev/null 2>&1 && break; sleep .5; done

          python3 - <<'PY'
          import time,json
          from pathlib import Path
          import pychrome
          root=Path('final-review')
          pages=['englishpt.html','courses.html','english-conversation.html','exam-english.html','student-english.html',
                 'stations.html','station-dobongsan.html','station-gangnam.html',
                 'dalseo-songhyeondong-adult-conv.html','dalseo-songhyeondong-1to1-toeic.html',
                 'seoul-jongno-sajikdong-toeic.html','seoul-jongno-sajikdong-beginner-english-conv.html',
                 'seoul-jongno-buamdong-beginner-english-conv.html','daegu-dalseo-songhyeondong-toeic.html']
          pages += sorted(p.name for p in root.glob('station-dobongsan-*.html'))
          pages=list(dict.fromkeys(pages))
          browser=pychrome.Browser(url='http://127.0.0.1:9237')
          tab=browser.new_tab(); tab.start(); tab.Page.enable(); tab.Runtime.enable()
          expr=r'''(()=>({w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,
            hero:!!document.querySelector('.hero'),finder:!!document.querySelector('[data-region-finder]'),
            localnav:!!document.querySelector('.local-navigation,.preserved-region-navigation'),
            form:!!document.querySelector('#leadForm')}))()'''
          checks=0
          for mode,w,h,mobile in [('desktop',1440,900,False),('mobile',390,844,True)]:
              tab.call_method('Emulation.setDeviceMetricsOverride',width=w,height=h,deviceScaleFactor=1,mobile=mobile,screenWidth=w,screenHeight=h,dontSetVisibleSize=False)
              for name in pages:
                  tab.Page.navigate(url='http://127.0.0.1:8777/'+name); time.sleep(.25)
                  m=tab.Runtime.evaluate(expression=expr,returnByValue=True)['result']['value']
                  assert m['sw']<=w,(mode,name,m)
                  assert m['hero'] or name.startswith('dalseo-songhyeondong-'),(mode,name,'hero')
                  if name in ('englishpt.html','courses.html','english-conversation.html','exam-english.html','student-english.html'):
                      assert m['finder'],(mode,name,'finder')
                  if 'sajikdong-' in name or 'buamdong-' in name or 'daegu-dalseo-songhyeondong-' in name or name.startswith('dalseo-songhyeondong-'):
                      assert m['localnav'],(mode,name,'localnav')
                  checks+=1

              # Prove the region-first UI actually resolves to an existing generated page.
              tab.Page.navigate(url='http://127.0.0.1:8777/englishpt.html'); time.sleep(.5)
              result=tab.Runtime.evaluate(expression=r'''(async()=>{
                const wait=ms=>new Promise(r=>setTimeout(r,ms));
                const sido=document.querySelector('[data-region-sido]');
                const juris=document.querySelector('[data-region-jurisdiction]');
                const dong=document.querySelector('[data-region-dong]');
                const intent=document.querySelector('[data-region-intent]');
                const go=document.querySelector('[data-region-go]');
                for(let i=0;i<20&&sido.options.length<2;i++) await wait(100);
                sido.value='서울특별시'; sido.dispatchEvent(new Event('change',{bubbles:true}));
                await wait(100);
                const j=[...juris.options].find(o=>o.textContent.includes('종로구')); if(!j)return {ok:false,at:'jurisdiction',opts:[...juris.options].map(o=>o.textContent)};
                juris.value=j.value; juris.dispatchEvent(new Event('change',{bubbles:true}));
                await wait(100);
                const d=[...dong.options].find(o=>o.textContent==='사직동'); if(!d)return {ok:false,at:'dong',opts:[...dong.options].map(o=>o.textContent)};
                dong.value=d.value; intent.value='toeic';
                const expected='/seoul-jongno-sajikdong-toeic.html';
                const target='/'+dong.value+'-'+intent.value+'.html';
                return {ok:target===expected,target,exists:!!go};
              })()''',awaitPromise=True,returnByValue=True)['result']['value']
              assert result['ok'] and result['exists'],result
              assert (root/result['target'].lstrip('/')).exists(),result
              checks+=1
          tab.stop(); browser.close_tab(tab)
          print('PASS_FINAL_IA_CHROMIUM',checks)
          PY

      - name: Responsive typography and viewport matrix QA
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          root=Path('final-review')
          pages=[p for p in root.glob('*.html') if p.name not in {'404.html','index.html'}]
          assert len(pages)==140391,len(pages)
          bad_viewport=[]
          bad_css=[]
          for p in pages:
              raw=p.read_text(encoding='utf-8',errors='ignore')
              if 'name="viewport"' not in raw:
                  bad_viewport.append(p.name)
              if 'pilot.css' not in raw and 'styles.css' not in raw:
                  bad_css.append(p.name)
          assert not bad_viewport,bad_viewport[:20]
          assert not bad_css,bad_css[:20]
          print('PASS_RESPONSIVE_STATIC_CONTRACT',len(pages))
          PY

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 8778 --directory final-review >/tmp/responsive-review-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars             --remote-debugging-port=9238 --remote-allow-origins='*'             --user-data-dir=/tmp/final-responsive-chrome about:blank >/tmp/final-responsive-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$SERVER_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9238/json/version >/dev/null 2>&1 && break; sleep .5; done

          python3 - <<'PY'
          import json,time
          from pathlib import Path
          import pychrome

          root=Path('final-review')
          intents=[
              'elem-tutor','mid-conv','high-conv','univ-conv','jobseeker-conv',
              'biz-business-conv','housewife-conv',
              'toeic','toeic-speaking','opic','ielts','duolingo','toefl',
              'toeic-academy','toeic-speaking-academy','opic-academy',
              'ielts-academy','duolingo-academy','toefl-academy',
              'english-conv-academy','adult-english-conv-academy',
              'worker-english-conv-academy','beginner-english-conv'
          ]
          pages=[
              'englishpt.html','courses.html','english-conversation.html','exam-english.html','student-english.html',
              'stations.html',
              'station-gangnam.html','station-419minjumyoji.html','station-amsayeoksagongwon.html',
              'station-yonginjungangsijang.html',
              'dalseo-songhyeondong.html','dalseo-songhyeondong-adult-conv.html','dalseo-songhyeondong-1to1-toeic.html',
              'dalseo-songhyeondong-intl-academic-writing.html'
          ]
          pages += [f'seoul-jongno-sajikdong-{x}.html' for x in intents]
          pages += [f'daegu-dalseo-songhyeondong-{x}.html' for x in intents]
          pages += [f'station-gangnam-{x}.html' for x in intents]
          pages=list(dict.fromkeys(pages))
          missing=[x for x in pages if not (root/x).exists()]
          assert not missing,missing

          viewports=[
              ('desktop-xl',1440,900,False),
              ('desktop',1280,800,False),
              ('desktop-compact',1024,768,False),
              ('tablet',768,1024,True),
              ('mobile-wide',430,932,True),
              ('mobile',390,844,True),
              ('mobile-narrow',360,800,True),
              ('mobile-min',320,700,True),
          ]

          browser=pychrome.Browser(url='http://127.0.0.1:9238')
          tab=browser.new_tab(); tab.start(); tab.Page.enable(); tab.Runtime.enable()
          expr=r'''(()=>{
            const visible=el=>{
              const s=getComputedStyle(el),r=el.getBoundingClientRect();
              return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;
            };
            const textEls=[...document.querySelectorAll('h1,h2,h3,p,li,a,button,summary,strong,span,label')].filter(visible);
            const nowrap=textEls.filter(el=>{
              if(el.closest('.breadcrumb')) return false;
              const s=getComputedStyle(el);
              return s.whiteSpace==='nowrap' && el.scrollWidth>el.clientWidth+2;
            }).slice(0,8).map(el=>({tag:el.tagName,cls:el.className,text:(el.textContent||'').trim().slice(0,80),sw:el.scrollWidth,cw:el.clientWidth}));
            const h1=document.querySelector('.hero h1,h1');
            const countLines=el=>{
              if(!el||!visible(el)) return 0;
              const range=document.createRange();
              range.selectNodeContents(el);
              const rects=[...range.getClientRects()].filter(r=>r.width>0&&r.height>0);
              const tops=[];
              for(const r of rects){
                if(!tops.some(t=>Math.abs(t-r.top)<2)) tops.push(r.top);
              }
              return Math.max(1,tops.length);
            };
            const heroLines=countLines(h1);
            const hs=h1?getComputedStyle(h1):null;
            const hr=h1?h1.getBoundingClientRect():null;
            const gridCols=sel=>{
              const el=document.querySelector(sel);
              return el&&visible(el)?getComputedStyle(el).gridTemplateColumns:'';
            };
            return {
              w:innerWidth,
              sw:document.documentElement.scrollWidth,
              bodySw:document.body.scrollWidth,
              nowrap,
              heroLines,
              h1:(h1?.textContent||'').trim().slice(0,100),
              h1Font:hs?hs.fontSize:'',
              h1LineHeight:hs?hs.lineHeight:'',
              h1Width:hr?Math.round(hr.width):0,
              h1Height:hr?Math.round(hr.height):0,
              heroGrid:gridCols('.hero-grid'),
              mainGrid:gridCols('.grid4,.quad,.station-course-links,.quick-directory-grid,.teacher-trust-grid,.region-finder-grid'),
              heroSheetVisible:!!document.querySelector('.hero-sheet')&&visible(document.querySelector('.hero-sheet')),
              floatingVisible:!!document.querySelector('.floating-contact')&&visible(document.querySelector('.floating-contact')),
              mobileStickyVisible:!!document.querySelector('.mobile-sticky')&&visible(document.querySelector('.mobile-sticky'))
            };
          })()'''

          checks=0
          report=[]
          visual_targets={
              'englishpt.html',
              'seoul-jongno-sajikdong-beginner-english-conv.html',
              'seoul-jongno-sajikdong-toeic.html',
              'seoul-jongno-sajikdong-ielts.html',
              'dalseo-songhyeondong.html',
              'station-gangnam.html',
          }
          visual_compare={}
          for mode,w,h,mobile in viewports:
              tab.call_method('Emulation.setDeviceMetricsOverride',width=w,height=h,deviceScaleFactor=1,mobile=mobile,screenWidth=w,screenHeight=h,dontSetVisibleSize=False)
              for name in pages:
                  tab.Page.navigate(url='http://127.0.0.1:8778/'+name)
                  time.sleep(.10)
                  m=tab.Runtime.evaluate(expression=expr,returnByValue=True)['result']['value']
                  assert m['sw']<=w+1,(mode,name,'document-overflow',m)
                  assert m['bodySw']<=w+1,(mode,name,'body-overflow',m)
                  assert not m['nowrap'],(mode,name,'nowrap-text-overflow',m['nowrap'])
                  assert m['heroLines']<=3,(mode,name,'hero-lines',m['heroLines'],m['h1'],m)
                  if name in visual_targets and mode in {'desktop-xl','mobile'}:
                      visual_compare.setdefault(name,{})[mode]=m
                  checks+=1
              report.append({'mode':mode,'width':w,'height':h,'pages':len(pages)})

          tab.stop(); browser.close_tab(tab)
          responsive_report={'status':'PASS','checks':checks,'pages':len(pages),'viewports':report,'visual_compare':visual_compare}
          (root/'STAGE9_RESPONSIVE_QA_V16.json').write_text(
              json.dumps(responsive_report,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8'
          )
          print('PASS_RESPONSIVE_VIEWPORT_MATRIX',checks,'PAGES',len(pages),'VIEWPORTS',len(viewports))
          print('FINAL_VISUAL_COMPARE',json.dumps(visual_compare,ensure_ascii=False,sort_keys=True))
          PY

      - name: Build downloadable sample and final release archives
        run: |
          set -euo pipefail
          rm -rf englishpt-sample-preview
          mkdir -p englishpt-sample-preview
          python3 - <<'PY'
          import re, shutil, json
          from pathlib import Path

          src=Path('final-review')
          out=Path('englishpt-sample-preview')
          samples=[
              'englishpt.html',
              'seoul-jongno-sajikdong-beginner-english-conv.html',
              'seoul-jongno-sajikdong-toeic.html',
              'seoul-jongno-sajikdong-ielts.html',
