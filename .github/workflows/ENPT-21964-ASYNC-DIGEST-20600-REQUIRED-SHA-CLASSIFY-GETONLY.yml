name: ENPT 21964 Async Draft Required 20600 SHA Paths Exact GET-only Audit
on:
  push:
    branches:
      - ops/v23521-OG21964-ASYNC-DIGEST-DRAFT-ONLY-ONCE-20261020
    paths:
      - .github/workflows/ENPT-21964-ASYNC-DIGEST-20600-REQUIRED-SHA-CLASSIFY-GETONLY.yml
permissions:
  contents: read
  actions: read
jobs:
  audit-required-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 39379746225
          name: ENPT_21964_REAL_ALL_SHA256_HASH_NONPUBLISHED_ASYNC_DIGEST_ONE_SHOT
          github-token: ${{ github.token }}
          path: prior-signed
      - name: GET required SHA list and classify all paths by original digest, no Netlify writes
        run: |
          set -euo pipefail
          mkdir -p required-audit
          python3 - <<'PY'
          import os,urllib.request,json,gzip,collections,datetime,pathlib,csv,hashlib
          out=pathlib.Path('required-audit')
          site='98d96cc5-f0b7-4d3d-8072-6476d93e55a3'
          draft='6ad708da374d457504481d5c'
          prod='6ad5eb4918f9411c4d5e1ba4'
          marker='ENPT-21964-OG-ASYNC-DIGEST-ONE-DRAFT-NOT-PRODUCTION-20261020'
          def api(endpoint):
            req=urllib.request.Request('https://api.netlify.com/api/v1/'+endpoint,method='GET',headers={
              'Authorization':'Bearer '+os.environ['NETLIFY_AUTH_TOKEN'],
              'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=40) as resp:return json.load(resp)
          siteInfo=api('sites/'+site)
          d=api('sites/'+site+'/deploys/'+draft)
          assert (siteInfo.get('published_deploy') or {}).get('id')==prod and siteInfo['custom_domain']=='englishpt.kr'
          assert d.get('site_id')==site and d.get('id')==draft and d.get('title')==marker
          assert d.get('published_at') is None and d.get('state') in ('preparing','prepared','uploading','uploaded','ready')
          digest=next(pathlib.Path('prior-signed').rglob('FULL_202765_STATIC_SHA1_DIGEST.json.gz'))
          with gzip.open(digest,'rt',encoding='utf8') as f: paths=json.load(f)
          assert len(paths)==202765
          bysha=collections.defaultdict(list)
          for k,v in paths.items():bysha[v].append(k)
          missing=d.get('required') or []
          cats=collections.Counter()
          ex=collections.defaultdict(list)
          unmatched=[]
          affected=set()
          for sha in missing:
            ps=bysha.get(sha,[])
            if not ps:unmatched.append(sha);continue
            for p in ps:
              affected.add(p)
              if p.startswith('/assets/images/seo-square/v1/'):cat='square_jpeg'
              elif p.startswith('/__pages/'):cat='seo_edge_page'
              elif p.startswith('/.netlify/internal/edge-functions/'):cat='edge_manifest'
              elif p.endswith('.html'):cat='html'
              elif p in ('/_headers','/_redirects','/robots.txt','/sitemap-index.xml','/netlify.toml'):cat='critical_site_config'
              elif p.startswith('/sitemaps/'):cat='sitemap'
              else:cat='other_static'
              cats[cat]+=1
              if len(ex[cat])<6:ex[cat].append(p)
          if unmatched:raise RuntimeError('Required SHA1 absent from source manifest '+str(len(unmatched)))
          report={'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
             'status':'PASS_ALL_REQUIRED_20600_SHA_MATCH_SOURCE' if len(missing)==20600 else 'REVIEW_REQUIRED_SHA_COUNT_CHANGED',
             'draft_id':draft,'draft_state':d.get('state'),'published_production_unchanged':True,
             'static_manifest_count':len(paths),'distinct_sha_count':len(bysha),
             'required_static_sha_count':len(missing),'required_static_unique_sha_count':len(set(missing)),
             'required_edge_sha':d.get('required_edge_functions'),'required_functions':d.get('required_functions'),
             'required_count_by_path_category':dict(cats),'examples':dict(ex),
             'number_of_paths_affected':len(affected),'unmatched_sha':0,
             'site_mutations':0,'uploads':0,'draft_created':False,
             'safety_status':'REQUIRES_SAFE_BATCH_UPLOAD_STRATEGY_BEFORE_20000_REQUESTS'}
          (out/'REQUIRED_FILE_SHA_CLASSIFICATION.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          with (out/'REQUIRED_SHA_TO_PATHS.csv').open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.writer(f);w.writerow(['required_sha1','url_path','category'])
            for sha in missing:
              for p in bysha[sha]:
                cat='square_jpeg' if p.startswith('/assets/images/seo-square/v1/') else ('seo_edge_page' if p.startswith('/__pages/') else 'other')
                w.writerow([sha,p,cat])
          print('ENPT_ASYNC_20600_REQUIRED_SHA_CLASSIFIED',json.dumps(report,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENPT_21964_ASYNC_DIGEST_20600_REQUIRED_SHA_CATEGORIES_NO_UPLOAD
          path: required-audit/
          retention-days: 30
          if-no-files-found: warn
