name: ENPT V3 Full 202786 Static SHA-Digest OFFLINE Preflight no deploy
on:
  push:
    branches: [review/enpt-v3-fullsite-draft-20261027]
    paths: [.github/workflows/enpt-v3-sha-reuse-offline-preflight.yml]
permissions:
  contents: read
  actions: read
jobs:
  safe-offline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_V3_READONLY_FULL_PUBLISHED_SHA_FILE_MANIFEST
          run-id: 40459650646
          github-token: ${{ github.token }}
          path: published-manifest
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-NAVER-TAG-PRESERVE-GOOGLE-180800-FULL-QA
          run-id: 39234109195
          github-token: ${{ github.token }}
          path: signed-qa-map
      - name: Original V2 published-source rebuild from signed 5149 locality rows
        run: |
          set -euo pipefail
          python3 scripts/ENPT_REGION_DRAFT_BUILD_20261027.py
          python3 scripts/ENPT_REGION_FINAL_INTEGRATION_20261027.py
          python3 scripts/ENPT_REGION_V2_FIX_5149_LINKS_20261027.py
          test "$(find region-review-site/regions -maxdepth 1 -name '*.html' | wc -l)" -eq 17
      - name: Merge only 3 sharded source pages plus 18 region new paths into complete Published file digest
        run: |
          set -euo pipefail
          python3 scripts/ENPT_V3_SHA_REUSE_MINIMAL_FULLSITE_BUILDER_20261027.py
          test -s v3-digest-qa/V3_SHA_ONLY_SOURCE_GUARD.json
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('v3-digest-qa/V3_SHA_ONLY_SOURCE_GUARD.json').read_text('utf8'))
          assert r['status']=='PASS_V3_202786_SHA1_FILE_SOURCE_ONLY'
          assert (r['source_file_count'],r['candidate_file_count'])==(202768,202786)
          assert r['new_region_files']==18 and len(r['existing_files_modified'])==3
          assert r['signed_existing_routes']==158571 and r['signed_noindex_count']==136607
          assert r['OG_images_preserved']==21964 and r['sitemaps_unchanged']==44
          assert r['unchanged_existing_entries']==202765 and r['course_targets']==36043
          assert r['removed_files']==0 and r['bad_bare_town_links']==0
          print('PASS_V3_202786_SHA_ONLY_MINIMAL_CHANGE',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENPT_V3_202786_SHA_FULLSITE_PREFLIGHT_ONLY_NO_NETLIFY_UPLOAD
          path: |
            v3-digest-qa/V3_SHA_ONLY_SOURCE_GUARD.json
            v3-digest-qa/V3_202786_CANDIDATE_FILES_SHA1.json.gz
          retention-days: 30
