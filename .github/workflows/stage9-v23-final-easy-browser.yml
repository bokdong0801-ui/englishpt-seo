name: ENGLISH PT v23.2 Beginner Readability Browser QA (No Deploy)

on:
  push:
    branches:
      - review/v23-aftercare-cta-20261014
    paths:
      - '.github/workflows/stage9-v23-final-easy-browser.yml'

permissions:
  contents: read

jobs:
  browser-readability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser library
        run: python -m pip install --quiet pychrome
      - name: Real responsive hub UI and beginner example check
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 8989 --directory . >/tmp/easycopy-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --remote-debugging-port=9239 --remote-allow-origins='*' --user-data-dir=/tmp/v23-easycopy-chrome about:blank >/tmp/easycopy-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$SERVER_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:9239/json/version >/dev/null 2>&1 && break; sleep .5; done
          python3 scripts/qa-stage9-v23-final-easy-browser.py
      - name: Store screenshots and UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23-beginner-readability-browser
          path: v23-easycopy-browser-review/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 2
