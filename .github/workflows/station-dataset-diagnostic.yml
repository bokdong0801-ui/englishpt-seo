name: Station Dataset Diagnostic

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'station-dataset-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect nationwide station dataset
        run: |
          curl -fsSL "https://gist.githubusercontent.com/lacti/f0d1a0915a32697fe3cf8f7997e18c52/raw/4a71b4b16ee2a25737acd1fdc595b7b8824a0dd1/korean-subway-station-list.json5" -o /tmp/stations.json5
          python3 - <<'PY'
          import ast, re, json
          raw=open('/tmp/stations.json5',encoding='utf-8').read()
          raw=re.sub(r'//.*','',raw)
          rows=ast.literal_eval(raw)
          uniq={}
          for row in rows:
              name=row.get('name','').strip()
              if not name: continue
              item=uniq.setdefault(name,{'name':name,'cities':set(),'areas':set(),'lines':set(),'lat':row.get('lat'),'lng':row.get('lng')})
              if row.get('city'): item['cities'].add(row['city'])
              item['areas'].update(row.get('areas') or [])
              item['lines'].update(row.get('lines') or [])
          print(json.dumps({
            'raw_rows':len(rows),
            'unique_station_names':len(uniq),
            'cities':sorted({c for x in uniq.values() for c in x['cities']}),
            'sample_dobongsan': {k:(sorted(v) if isinstance(v,set) else v) for k,v in uniq.get('도봉산역',{}).items()},
            'sample_songhyeon': {k:(sorted(v) if isinstance(v,set) else v) for k,v in uniq.get('송현역',{}).items()},
            'has_ara':'아라역' in uniq,
            'has_daegyeong_line':any('대경' in line for x in uniq.values() for line in x['lines']),
          },ensure_ascii=False,indent=2))
          PY
