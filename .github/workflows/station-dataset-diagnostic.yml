name: Station Dataset Diagnostic

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'station-dataset-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect station index DOM
        run: |
          python3 -m pip install --quiet beautifulsoup4
          curl -fsSL "https://e-english.kr/sub" -o /tmp/station-index.html
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import re
          soup=BeautifulSoup(open('/tmp/station-index.html',encoding='utf-8').read(),'html.parser')
          for s in soup.find_all(string=re.compile(r'^1호선 \(102\)$')):
              print("TEXT",repr(s))
              print("PARENT",s.parent.name,s.parent.attrs)
              print("PARENT_HTML",str(s.parent)[:1200])
              print("GRAND",s.parent.parent.name,s.parent.parent.attrs)
              print("GRAND_HTML",str(s.parent.parent)[:3500])
              break
          PY
