name: ENPT SEO A October21 Signed Original HTML to V31 SHA Source Audit
on:
  push:
    branches: [review/enpt-seo-titles-approved-a-v1-20261028]
    paths: [.github/workflows/enpt-seo-a-oct21-original-html-v31-sha-qa-20261028.yml]
permissions: {contents: read, actions: read}
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_V3_READONLY_FULL_PUBLISHED_SHA_FILE_MANIFEST
          run-id: 40459650646
          github-token: ${{ github.token }}
          path: published-manifest
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-NAVER-TAG-PRESERVE-GOOGLE-180800-FULL-QA
          run-id: 39234109195
          github-token: ${{ github.token }}
          path: signed-qa-map
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-NAVER-GOOGLE-TAGS-2HOMES-FULL-CANDIDATE-NOT-DEPLOYED
          run-id: 39234109195
          github-token: ${{ github.token }}
          path: original-oct21-candidate
      - name: Recreate unchanged V3.1 202786 static manifest before source comparison
        run: |
          set -euo pipefail
          python3 scripts/ENPT_REGION_DRAFT_BUILD_20261027.py
          python3 scripts/ENPT_REGION_FINAL_INTEGRATION_20261027.py
          python3 scripts/ENPT_REGION_V2_FIX_5149_LINKS_20261027.py
          python3 scripts/ENPT_V3_SHA_REUSE_MINIMAL_FULLSITE_BUILDER_20261027.py
          python3 scripts/ENPT_V3_1_FIX_7_LOCALITY_TITLES_ONLY_20261027.py
      - name: Seven original station HTML samples in immutable archive vs V31 sharded payload SHA
        run: |
          set -euo pipefail
          mkdir -p sample-historical-here oct21-historical-qa
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
          ARCHIVE=original-oct21-candidate/ENGLISHPT_v23521_NAVER_GOOGLE_META_ONLY_TWO_HOME_NOT_DEPLOYED.tar.zst
          echo "6d0272d1601a1a47abeccc4d740359af9e7678293ee0a3d257eecd2ca478d884  $ARCHIVE" | sha256sum -c -
          tar --zstd -tf "$ARCHIVE" > oct21-historical-qa/all-archive-paths.txt
          echo "ENPT_ARCHIVE_FIRST_15"
          head -n 15 oct21-historical-qa/all-archive-paths.txt
          echo "ENPT_ARCHIVE_STATION_NAMING_SAMPLE"
          grep -E 'station-banwoldang|station-gangnam|__pages' oct21-historical-qa/all-archive-paths.txt | head -n 12 || true
          tar --zstd -xf "$ARCHIVE" -C sample-historical-here --wildcards '*station-banwoldang.page' '*station-gangnam.page' '*station-seomyeon.page' '*station-banwoldang-biz-business-conv.page' '*station-gangnam-opic.page' '*station-sangmu-elem-tutor.page' '*station-gapcheon-duolingo-academy.page'
          python3 - <<'PY'
          import pathlib,gzip,json,hashlib
          base=pathlib.Path('sample-historical-here')
          with gzip.open('v3-1-patch-evidence/V3_1_202786_CANDIDATE_FILES_SHA1.json.gz','rt') as f:m=json.load(f)
          with gzip.open('signed-qa-map/NAVER_GOOGLE_TWO_HOME_NEW_SHA1_MAP.json.gz','rt') as f:links=json.load(f)['original_public_html_to_data_payload']
          names=['station-banwoldang.html','station-gangnam.html','station-seomyeon.html',
          'station-banwoldang-biz-business-conv.html','station-gangnam-opic.html',
          'station-sangmu-elem-tutor.html','station-gapcheon-duolingo-academy.html']
          out=[]
          for n in names:
              hits=list(base.rglob(n.replace(".html",".page")))
              assert len(hits)==1,(n,hits[:3])
              b=hits[0].read_bytes()
              h=hashlib.sha1(b).hexdigest()
              path='/'+links[n]['to']
              expected=m.get(path)
              out.append({'route':n,'original_archive_sha1':h,'v31_sha1':expected,'identical':h==expected,'original_bytes':len(b)})
          good=sum(x['identical'] for x in out)
          result={'status':'PASS_FULL_LOCAL_ARCHIVE_ELIGIBLE' if good==7 else 'HOLD_ARCHIVE_NOT_BYTE_IDENTICAL',
               'identical':good,'tested':len(out),'results':out,'netlify_deploys':0,'production_publishes':0}
          pathlib.Path('oct21-historical-qa/sha-comparison.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('ENPT_OCT21_ORIGINAL_V31_SHA_COMPARISON',json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENPT_OCT21_ORIGINAL_TO_FROZEN_V31_SEO_SOURCE_SHA_COMPARISON
          path: oct21-historical-qa/
          retention-days: 30
