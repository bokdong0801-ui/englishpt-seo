name: ENGLISH PT Netlify Credit Root Cause Readonly Diagnostic ONE SHOT
on:
  push:
    branches: [ops/v23521-netlify-credit-diag-20261017]
    paths: ['.github/workflows/stage9-v23521-netlify-credit-root-cause-readonly-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  investigate-account-with-no-payments-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require GET only in Netlify diagnostic
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v23521_netlify_credits_readonly_diagnostic.py
          python3 - <<'PY'
          from pathlib import Path
          data=Path('scripts/v23521_netlify_credits_readonly_diagnostic.py').read_text('utf8')
          assert 'method=\'GET\'' in data
          assert not any(s in data for s in ['method=\'POST\'','method=\'PATCH\'','method=\'DELETE\'','netlify deploy','--prod'])
          assert 'SITE=\'98d96cc5-f0b7-4d3d-8072-6476d93e55a3\'' in data
          print('PASS_STRICTLY_NETLIFY_READONLY_ACCOUNT_CREDIT_CHECK',flush=True)
          PY
      - name: GET current team credit balance, operational mode, usage flags and last deployments
        run: python3 scripts/v23521_netlify_credits_readonly_diagnostic.py
      - name: Retain diagnostic regardless of a HOLD outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23521-netlify-credit-root-cause-readonly-report
          path: netlify-credit-diagnostic/
          retention-days: 30
          if-no-files-found: warn
