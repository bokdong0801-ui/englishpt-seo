name: ENPT SEO V31 Full SHA Resilient 21864 GET-only Gate 20261030
on:
  push:
    branches: [review/enpt-seo-titles-approved-a-v1-20261028]
    paths: [.github/workflows/enpt-seo-v31-full-resilient-offline-20261030.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: enpt-seo-a-v31-exact-shard-offline-20261028
  cancel-in-progress: false
jobs:
  full-offline-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_V3_READONLY_FULL_PUBLISHED_SHA_FILE_MANIFEST
          run-id: 40459650646
          github-token: ${{ github.token }}
          path: published-manifest
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-NAVER-TAG-PRESERVE-GOOGLE-180800-FULL-QA
          run-id: 39234109195
          github-token: ${{ github.token }}
          path: signed-qa-map
      - name: Full exact V31 202786 SHA source reproduce preserving 7 locality fixes
        run: |
          set -euo pipefail
          python3 scripts/ENPT_REGION_DRAFT_BUILD_20261027.py
          python3 scripts/ENPT_REGION_FINAL_INTEGRATION_20261027.py
          python3 scripts/ENPT_REGION_V2_FIX_5149_LINKS_20261027.py
          python3 scripts/ENPT_V3_SHA_REUSE_MINIMAL_FULLSITE_BUILDER_20261027.py
          python3 scripts/ENPT_V3_1_FIX_7_LOCALITY_TITLES_ONLY_20261027.py
      - name: Test 7 original V31 source payload SHA and SEO-only minimal head transform
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/enpt_seo_v31_shard_minimal_patch_20261030.py --mode sample
      - name: FULL 21864 frozen source HTML GET SHA compare and title OG JSONLD patch; no API POST
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
        run: |
          set -euo pipefail
          timeout 2300s python3 scripts/enpt_seo_v31_shard_minimal_patch_20261030.py --mode full
          python3 - <<'PY'
          import json,gzip,pathlib
          root=pathlib.Path('seo-v31-minimal')
          x=json.loads((root/'full-summary.json').read_text())
          assert x['status']=='PASS' and x['processed']==21864
          with gzip.open(root/'SEO_A_V31_202786_STATIC_FILES_SHA1.json.gz','rt') as f:m=json.load(f)
          assert len(m)==202786
          assert len(list((root/'delta').rglob('*.page')))==21864
          print('ENPT_SEO_V31_ALL_BLOB_HASHES_RECONCILED_NO_DEPLOY',len(m),flush=True)
          PY
      - name: Final safety - Netlify Production and V3.1 draft identity GET only
        if: always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          t=os.environ['NETLIFY_AUTH_TOKEN'];base='https://api.netlify.com/api/v1/'
          def get(p):
            q=urllib.request.Request(base+p,method='GET',headers={'Authorization':'Bearer '+t})
            with urllib.request.urlopen(q,timeout=40) as r:return json.load(r)
          sid='98d96cc5-f0b7-4d3d-8072-6476d93e55a3'
          s=get('sites/'+sid);d=get('sites/'+sid+'/deploys/6ae06963f085b33a5ee903eb')
          assert (s.get('published_deploy') or {}).get('id')=='6adafef5f2c6d196833683db'
          assert d.get('state')=='ready' and d.get('published_at') is None and d.get('draft') is not False
          print('ENPT_SEO_V31_PROTECTED_BASELINE_PASS',s['published_deploy']['id'],d['id'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENPT_SEO_A_V31_20261030_RESILIENT_FULL_SHA_GATE
          path: |
            seo-v31-minimal/*-summary.json
            seo-v31-minimal/title-route-diff-samples.json
            v3-1-patch-evidence/V3_1_7_LOCALITY_CORRECTION_SOURCE_GUARD.json
          retention-days: 30

      - name: Archive verified 21864 exact HTML head-only deltas for separate nonpublished Preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ENPT_SEO_A_V31_20261030_VERIFIED_21864_HEAD_DELTA
          path: |
            seo-v31-minimal/full-summary.json
            seo-v31-minimal/SEO_A_V31_202786_STATIC_FILES_SHA1.json.gz
            seo-v31-minimal/delta/
          retention-days: 14
          compression-level: 5
          if-no-files-found: error
