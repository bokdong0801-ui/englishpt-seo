name: ENPT V3 202786 FULLSITE ONE Nonpublished Digest Draft
on:
  push:
    branches: [review/enpt-v3-fullsite-draft-20261027]
    paths: [.github/workflows/enpt-v3-fullsite-one-nonproduction-sha-deploy.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: enpt-v3-fullsite-20261027-one-draft-no-production
  cancel-in-progress: false
jobs:
  single_digest_draft:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      ENPT_SITE_ID: 98d96cc5-f0b7-4d3d-8072-6476d93e55a3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_V3_READONLY_FULL_PUBLISHED_SHA_FILE_MANIFEST
          run-id: 40459650646
          github-token: ${{ github.token }}
          path: published-manifest
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-NAVER-TAG-PRESERVE-GOOGLE-180800-FULL-QA
          run-id: 39234109195
          github-token: ${{ github.token }}
          path: signed-qa-map
      - name: Hard guard one API POST, no prod flags, no form POST
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/ENPT_V3_SHA_ONLY_ONE_ASYNC_DRAFT_20261027.py').read_text()
          assert 'draft":True' in s and 'async":True' in s
          assert s.count('method="POST"')==1
          assert '/restore' not in s and '--prod' not in s
          assert 'EXPECTED_PUBLISHED' not in s or '6adafef5f2c6d196833683db' in s
          print('PASS_SINGLE_API_DRAFT_POST_NO_PROD_NO_FORM_POST')
          PY
      - name: Rebuild V2 signed locality pages and original Published HTML form fields
        run: |
          set -euo pipefail
          python3 scripts/ENPT_REGION_DRAFT_BUILD_20261027.py
          python3 scripts/ENPT_REGION_FINAL_INTEGRATION_20261027.py
          python3 scripts/ENPT_REGION_V2_FIX_5149_LINKS_20261027.py
      - name: Rebuild and verify 202786 full file manifest; no changed OG images or old noindex
        run: |
          set -euo pipefail
          python3 scripts/ENPT_V3_SHA_REUSE_MINIMAL_FULLSITE_BUILDER_20261027.py
          test -s v3-digest-qa/V3_SHA_ONLY_SOURCE_GUARD.json
      - name: Exactly one nonpublished Draft manifest POST plus bounded required delta files
        run: |
          set -euo pipefail
          python3 scripts/ENPT_V3_SHA_ONLY_ONE_ASYNC_DRAFT_20261027.py
      - name: Final read-only Production published ID verification even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          t=os.environ.get('NETLIFY_AUTH_TOKEN','')
          assert t
          q=urllib.request.Request('https://api.netlify.com/api/v1/sites/'+os.environ['ENPT_SITE_ID'],
            method='GET',headers={'Authorization':'Bearer '+t})
          with urllib.request.urlopen(q,timeout=40) as r:s=json.load(r)
          p=(s.get('published_deploy') or {}).get('id')
          print('ENPT_V3_PUBLISHED_FINAL_ID',p,flush=True)
          assert p=='6adafef5f2c6d196833683db','PRODUCTION_CHANGED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENPT_V3_FULLSITE_202786_SINGLE_DRAFT_OR_HOLD_EVIDENCE
          path: |
            v3-live-upload-evidence/
            v3-digest-qa/V3_SHA_ONLY_SOURCE_GUARD.json
          retention-days: 30
