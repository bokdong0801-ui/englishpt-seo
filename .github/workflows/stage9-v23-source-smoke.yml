name: ENGLISH PT V23 source smoke (review branch only)

on:
  push:
    branches:
      - review/v23-aftercare-cta-20261014
    paths:
      - '.github/workflows/stage9-v23-source-smoke.yml'
      - 'scripts/stage9-clean-mass-renderer.py'
      - 'scripts/generate-v45-full-depth-pilot.py'
      - 'scripts/generate-v45-exam-pilot.py'
      - 'scripts/build-stage9-production-release.py'
      - 'scripts/qa-stage9-v23-cta-aftercare.py'
      - 'englishpt.html'
      - 'english-conversation.html'
      - 'courses.html'
      - 'student-english.html'
      - 'exam-english.html'
      - 'scripts/qa-beginner-readability.py'
      - 'scripts/qa-stage9-v23-easy-copy-final.py'
      - 'assets/stage9-mass-production.css'
      - 'assets/styles.css'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile v23 source and read-only audit
        run: |
          python -m py_compile scripts/stage9-clean-mass-renderer.py
          python -m py_compile scripts/build-stage9-production-release.py
          python -m py_compile scripts/qa-stage9-v23-cta-aftercare.py
          python -m py_compile scripts/stage9_hero_copy.py
          python -m py_compile scripts/qa-beginner-readability.py
          python -m py_compile scripts/qa-stage9-v23-easy-copy-final.py
      - name: Source markup and count invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path('englishpt.html').read_text(encoding='utf-8')
          renderer = Path('scripts/stage9-clean-mass-renderer.py').read_text(encoding='utf-8')
          builder = Path('scripts/build-stage9-production-release.py').read_text(encoding='utf-8')
          css = Path('assets/styles.css').read_text(encoding='utf-8')
          assert home.count('<article class="change-card">') == 4
          conv = Path('english-conversation.html').read_text(encoding='utf-8')
          for page in (home, conv):
              assert page.count('<article class="change-card">') == 4
              assert '학습 과정 예시' in page
              assert all(x in page for x in ('1~3개월','3~6개월','6~9개월','9~12개월'))
              assert len(set(page.find(x) for x in ('1~3개월','3~6개월','6~9개월','9~12개월'))) == 4
          assert '4,"feedback"' in renderer
          for page in (home, conv):
              assert page.count('class="change-dialogue"') == 4
              assert page.count('class="change-dialogue-tip"') == 4
              assert page.count('class="change-dialogue-intro"') == 1
              assert page.count('class="change-dialogue-english"') >= 8
              assert page.count('class="change-dialogue-korean"') == page.count('class="change-dialogue-english"')
              assert page.count('lang="en"') == page.count('class="change-dialogue-english"')
          assert 'V23.1 period-by-period English dialogue examples' in css
          assert '수업 전후를 연결합니다' not in renderer
          assert 'class="manage-aftercare"' in renderer
          assert 'data-v23-aftercare="true"' in builder
          assert '"연습 방법도": "공부 방법도"' in builder
          assert '"연습 방법": "공부 방법"' in builder
          assert '왜 어려운지 알면 공부 방법도 달라집니다' in renderer
          assert 'apply_sitewide_operational_markup(page.read_text(encoding="utf-8", errors="ignore"), page.name)' in builder
          assert '@media(max-width:900px){.aftercare-choices{grid-template-columns:1fr}' in css
          print('PASS_V23_SOURCE_SMOKE_PRE_BUILD')
          PY

      - name: Beginner-first hub and 23-intent management example audit
        run: |
          python scripts/qa-stage9-v23-easy-copy-final.py \
            --root . --source-only --output STAGE9_V23_EASY_COPY_SOURCE.json
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('scripts/stage9-clean-mass-renderer.py').resolve()
          spec=importlib.util.spec_from_file_location('mass_renderer_v23',path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          loc={'slug':'seoul-jongno-sajikdong','dong':'사직동','service':'왕초보영어회화'}
          targets=mod.SERVICE_ORDER+mod.EXAM_ORDER+mod.ACADEMY_ORDER+mod.CONV_DERIVED_ORDER
          svc_gold, exam_gold = mod.gold_modules()
          cards=[("짧은 질문 듣기","짧은 질문에 답하기"),("내 소개","자기소개 해보기"),("생활영어","일상에서 사용하기"),("복습","다시 말하기")]
          sample_exam=next(iter(exam_gold.EXAMS.values()))
          for variation in ("scene","deadline","error","use","reuse"):
              assert len(svc_gold.feedback_examples(variation,"오늘 배운 내용을 다음 수업에서 다시 확인합니다.",cards))==4,variation
              assert len(exam_gold.feedbacks(sample_exam,variation))==4,variation
          assert len(targets)==23,len(targets)
          for intent in targets:
              family='exam' if intent in mod.EXAM_ORDER or intent in mod.ACADEMY_ORDER else 'service'
              content=mod.management_section(loc,intent,family)
              assert 'manage-aftercare' in content,intent
              assert 'manage-aftercare-example' in content,intent
              assert '생활에 맞게 조절하는 복습 예시' in content,intent
              assert '실제로 할 수 있는 양과 확인 방법은 상담에서 정합니다' in content,intent
              assert '숙제' in content,intent
              if intent=='beginner-english-conv':
                  assert content.count('class="beginner-sample-line"')==2,content
                  assert content.count('lang="en"')==2,content
                  assert content.count('<small>')==2,content
                  assert '실제 회원의 성과가 아니라' in content,content
              else:
                  assert 'class="beginner-sample"' not in content,intent
          styles=Path('assets/stage9-mass-production.css').read_text(encoding='utf-8')
          assert '.beginner-sample-line' in styles
          qa=Path('scripts/qa-beginner-readability.py').read_text(encoding='utf-8')
          assert "target = 4 if hub_name" in qa
          assert "home_change_report_four_stages_missing" in qa
          # Regression pair from GitHub run 38524289394: university pages
          # must not share a verbatim aftercare paragraph.
          pair=[
              {'slug':'busan-jung-sinchangdong3ga','dong':'신창동3가','service':'대학생영어회화'},
              {'slug':'seoul-eunpyeong-eungamje3dong','dong':'응암제3동','service':'대학생영어회화'},
          ]
          import re
          texts=[]
          for area in pair:
              part=mod.management_section(area,'univ-conv','service')
              block=re.search(r'<div class="manage-aftercare-example">(.*?)</div>',part,re.S)
              assert block,area
              texts.append(block.group(1))
          assert texts[0]!=texts[1],'university aftercare scenarios must differ'
          hub = Path('student-english.html').read_text(encoding='utf-8')
          links_html = mod.related_course_groups(
              {'slug':'seoul-jongno-sajikdong','dong':'사직동'}, 'worker-english-conv-academy'
          )
          for intent in ('elem-tutor','mid-conv','high-conv'):
              assert f'/seoul-jongno-sajikdong-{intent}.html' in links_html,intent
          for title, anchor in (
              ('초등학생영어회화','elementary'),
              ('중학생영어과외','middle'),
              ('고등학생영어과외','high'),
          ):
              assert ('사직동 '+title) in links_html,title
              assert ('href="/student-english.html#'+anchor+'"') in links_html,title
              assert ('id="'+anchor+'"') in hub,anchor
          for missing in ('elem-conv','mid-tutor','high-tutor'):
              assert f'/seoul-jongno-sajikdong-{missing}.html' not in links_html
          faq = dict(mod.FAQ_CURATED['worker-english-conv-academy'])
          assert len(faq)==5
          assert '하루 전까지' in faq['업무 일정 때문에 결석하면 보강이 가능한가요?']
          assert '수업 외 시간' in faq['개인 피드백은 어느 정도 받을 수 있나요?']
          assert '레벨테스트' in faq['수업 횟수는 어떻게 정해지나요?']
          assert '주 2~5회' in faq['수업 횟수는 어떻게 정해지나요?']
          print('PASS_V23_WORKER_FAQ_AND_STUDENT_DISCOVERY')
          print('PASS_V23_EASY_COPY_MANAGEMENT_23_INTENTS')
          PY
      - name: Save beginner-first source QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23-beginner-easy-copy-source-qa
          path: STAGE9_V23_EASY_COPY_SOURCE.json
          if-no-files-found: warn
          retention-days: 14
