name: ENPT V3.1 LIVE Final 7 Corrected Locality and Full SEO Mobile QA GET-only
on:
  push:
    branches: [review/enpt-v3-1-byeongmokandong-fix-20261027]
    paths: [.github/workflows/enpt-v31-live-final-qa.yml]
permissions:
  contents: read
jobs:
  final-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
      - name: Inspect live exact V3.1 Draft 7 fixes, 21 main/region pages, sitemap 44, responsive and forms, GET only
        run: python3 scripts/ENPT_V31_LIVE_FINAL_QA_20261027.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENPT_V31_CORRECTED_7_ROUTES_LIVE_SEO_MOBILE_QA
          path: v3-1-live-qa-evidence/
          retention-days: 30
