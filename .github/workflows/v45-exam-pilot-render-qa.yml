name: V4.5 Exam 5x6 Render QA
on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'pilot-v45-exam-5x6/*.html'
      - 'pilot-v45-exam-5x6/render-qa.mjs'
      - 'pilot-v45-exam-5x6/PILOT_EXAM_5X6_MANIFEST_V1.json'
      - '.github/workflows/v45-exam-pilot-render-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reset-english-service-seo-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 >/tmp/englishpt-exam-http.log 2>&1 &
          sleep 2
      - name: Run 30-page desktop/mobile render QA
        run: node pilot-v45-exam-5x6/render-qa.mjs
      - name: Commit render QA result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilot-v45-exam-5x6/PILOT_EXAM_5X6_RENDER_QA_V1.json
          if git diff --cached --quiet; then
            echo "No render QA changes"
          else
            git commit -m "Record V4.5 exam 5x6 render QA"
            git push origin HEAD:reset-english-service-seo-v3
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v45-exam-5x6-render-qa
          path: pilot-v45-exam-5x6/PILOT_EXAM_5X6_RENDER_QA_V1.json
