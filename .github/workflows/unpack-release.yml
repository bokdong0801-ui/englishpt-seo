name: Unpack ENGLISH PT release

on:
  push:
    branches:
      - release/englishpt-95-v1
    paths:
      - '.release/part-*'
      - '.github/workflows/unpack-release.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and unpack static site payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.release/part-*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Release payload chunks are not present yet; nothing to unpack."
            exit 0
          fi
          cat .release/part-* > /tmp/englishpt-site.tar.gz.b64
          base64 -d /tmp/englishpt-site.tar.gz.b64 > /tmp/englishpt-site.tar.gz
          echo "60d9e410e11b483d2a41b89cb64f7abfdafe3bb166dd02d1470d13c5e07e2525  /tmp/englishpt-site.tar.gz" | sha256sum -c -
          rm -rf /tmp/englishpt-site
          mkdir -p /tmp/englishpt-site
          tar -xzf /tmp/englishpt-site.tar.gz -C /tmp/englishpt-site
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.release/' \
            --exclude='README.md' \
            /tmp/englishpt-site/ ./

      - name: Commit expanded release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated file changes."
            exit 0
          fi
          git commit -m "build: expand ENGLISH PT 95-page release"
          git push origin HEAD:release/englishpt-95-v1
