name: ENPT V2 FINAL Polished LIVE Draft Chrome GET-only
on:
  push:
    branches: [review/enpt-region-hubs-v2-20261027]
    paths: [.github/workflows/enpt-v2-final-live-draft-chrome.yml]
permissions:
  contents: read
jobs:
  final-preview-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENPT_V2_PREVIEW_BASE: https://enpt-regions-v2-final-20261027--englishpt-seo.netlify.app
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: 98d96cc5-f0b7-4d3d-8072-6476d93e55a3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          python3 -m pip install -q playwright
          python3 -m playwright install chromium
      - name: Exact V2 polished Draft live clicks 390px 1440px without form POST
        run: python3 scripts/ENPT_REGION_V2_LIVE_DRAFT_QA_20261027.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENPT_REGION_V2_POLISHED_FINAL_LIVE_BROWSER_QA
          path: v2-live-browser-qa/
          retention-days: 30
