name: Sync Station Data

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'station-data-sync-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reset-english-service-seo-v3
      - name: Sync current station data
        run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 scripts/sync-station-data.py
      - name: Commit normalized station data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stations.json
          if git diff --cached --quiet; then
            echo "Station data unchanged"
            exit 0
          fi
          git commit -m "Sync nationwide 911-station dataset"
          git push origin HEAD:reset-english-service-seo-v3
