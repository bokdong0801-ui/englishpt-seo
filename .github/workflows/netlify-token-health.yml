name: Netlify Token Health Check

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'netlify-token-health-trigger.txt'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN_AUTH: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TOKEN_LEGACY: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - name: Check both tokens without exposing values
        run: |
          set -euo pipefail
          check_token() {
            local name="$1"
            local token="$2"
            if [ -z "$token" ]; then
              echo "$name=MISSING"
              return 0
            fi
            code=$(curl -sS -o /tmp/"$name".json -w "%{http_code}"               -H "Authorization: Bearer $token"               "https://api.netlify.com/api/v1/sites?per_page=1" || true)
            echo "$name=$code"
            if [ "$code" = "200" ]; then
              python3 - <<PY
import json
rows=json.load(open('/tmp/$name.json',encoding='utf-8'))
print('$name_VALID_SITES',len(rows))
PY
            fi
          }
          check_token AUTH "$TOKEN_AUTH"
          check_token LEGACY "$TOKEN_LEGACY"
