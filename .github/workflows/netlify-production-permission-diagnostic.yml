name: Netlify Production Permission Diagnostic

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'netlify-production-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Netlify production permission state
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"             "https://api.netlify.com/api/v1/sites/englishpt.kr"             -o /tmp/site.json
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"             "https://api.netlify.com/api/v1/user"             -o /tmp/user.json
          USER_ID="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/user.json',encoding='utf-8'))['id'])
          PY
          )"
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"             "https://api.netlify.com/api/v1/bokdong0801/members/$USER_ID"             -o /tmp/member.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/site.json',encoding='utf-8'))
          member=json.load(open('/tmp/member.json',encoding='utf-8'))
          published=d.get('published_deploy') or {}
          build=d.get('build_settings') or {}
          relevant={k:v for k,v in d.items() if any(x in k.lower() for x in ('deploy','prod','lock','protect','capab','permission')) and k not in ('published_deploy',)}
          safe={
            'site_name':d.get('name'),
            'url':d.get('url'),
            'account_slug':d.get('account_slug'),
            'member_role':member.get('role'),
            'prevent_non_git_prod_deploys':d.get('prevent_non_git_prod_deploys'),
            'published_deploy_locked':published.get('locked'),
            'published_deploy_state':published.get('state'),
            'published_deploy_context':published.get('context'),
            'repo_branch':build.get('repo_branch'),
            'repo_path':build.get('repo_path'),
            'stop_builds':build.get('stop_builds'),
            'allowed_branches':build.get('allowed_branches'),
            'relevant_site_flags':relevant,
          }
          print(json.dumps(safe,ensure_ascii=False,indent=2))
          PY
