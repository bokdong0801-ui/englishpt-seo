name: Netlify Production Permission Diagnostic

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'netlify-production-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect latest failed production deploy
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"             "https://api.netlify.com/api/v1/sites/englishpt.kr/deploys?production=true&per_page=10"             -o /tmp/deploys.json
          DEPLOY_ID="$(python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/deploys.json',encoding='utf-8'))
          row=next((x for x in rows if x.get('state')=='error'), rows[0])
          print(row['id'])
          PY
          )"
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"             "https://api.netlify.com/api/v1/sites/englishpt.kr/deploys/$DEPLOY_ID"             -o /tmp/deploy.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/deploy.json',encoding='utf-8'))
          safe={k:d.get(k) for k in ('id','state','context','branch','title','error_message','created_at','updated_at','published_at','skipped','locked','review_id','draft','framework')}
          print(json.dumps(safe,ensure_ascii=False,indent=2))
          PY
