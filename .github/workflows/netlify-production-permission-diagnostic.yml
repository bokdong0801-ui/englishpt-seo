name: Netlify Production Permission Diagnostic

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'netlify-production-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect recent Netlify deploy history
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"             "https://api.netlify.com/api/v1/sites/englishpt.kr/deploys?per_page=20"             -o /tmp/deploys.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/deploys.json',encoding='utf-8'))
          out=[]
          for d in rows:
              out.append({
                'id':d.get('id'),
                'state':d.get('state'),
                'context':d.get('context'),
                'draft':d.get('draft'),
                'branch':d.get('branch'),
                'title':d.get('title'),
                'created_at':d.get('created_at'),
                'published_at':d.get('published_at'),
                'locked':d.get('locked'),
                'deploy_url':d.get('deploy_url'),
              })
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
