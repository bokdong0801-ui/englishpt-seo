name: ENGLISH PT v23.4 Student Navigation 140391 Fix + QA (No Deploy)

on:
  workflow_dispatch:
  push:
    branches: [review/v23-aftercare-cta-20261014]
    paths: ['.github/workflows/stage9-v23-student-nav-fix-all-no-deploy.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: englishpt-v23-4-student-navigation-all-qa-no-deploy
  cancel-in-progress: false

jobs:
  patch-and-verify-only:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      V23_SOURCE_RUN: '38689660290'
      V23_SOURCE_SHA: a18b8901ecda7d37f65e35b15f03d579ec63c70f
      OG_SOURCE_RUN: '38766832143'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare failure report regardless of later stages
        run: |
          mkdir -p student-nav-report
          printf '{"status":"STARTED","source_run":"38689660290","og_source_run":"38766832143","netlify_deployed":false,"production_deployed":false,"form_submitted":false}\n' > student-nav-report/RUN_STATUS.json
      - name: Verify immutable original build and existing OG PASS source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          def get(path):
            req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}'+path,
              headers={'Authorization':'Bearer '+token,
                       'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          orig=get('/actions/runs/'+os.environ['V23_SOURCE_RUN'])
          assert orig['status']=='completed' and orig['conclusion']=='success'
          assert orig['head_sha']==os.environ['V23_SOURCE_SHA']
          assert orig['name']=='ENGLISH PT v23 Full 140391 QA (Review Source Only)'
          og=get('/actions/runs/'+os.environ['OG_SOURCE_RUN'])
          assert og['status']=='completed' and og['conclusion']=='success'
          assert og['name']=='ENGLISH PT v23.4 OG Landscape All Pages Build (No Deploy)'
          artifacts=get('/actions/runs/'+os.environ['OG_SOURCE_RUN']+'/artifacts?per_page=100')['artifacts']
          matched=[a for a in artifacts if a['name']=='englishpt-v23-4-og-square-safe-full-site-REVIEW-ONLY' and not a['expired']]
          assert len(matched)==1,'OG review-only artifact unavailable'
          print('PASS_APPROVED_V23_4_ORIGINAL_AND_OG_SOURCE',orig['head_sha'],og['id'])
          PY
      - name: Download last PASS v23.4 OG full-site source (no regeneration)
        id: download
        uses: actions/download-artifact@v4
        with:
          name: englishpt-v23-4-og-square-safe-full-site-REVIEW-ONLY
          run-id: 38766832143
          path: og-source
          github-token: ${{ github.token }}
      - name: Download OG artifact checksum report
        id: checksum
        uses: actions/download-artifact@v4
        with:
          name: englishpt-v23-4-og-full-qa-reports
          run-id: 38766832143
          path: og-report-source
          github-token: ${{ github.token }}
      - name: Validate checksum and extract 140391 pages
        id: extract
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
          (cd og-source && sha256sum -c ../og-report-source/OG_RELEASE_SHA256.txt)
          mkdir -p staged-site
          tar --zstd -xf og-source/englishpt-v23-4-og-safe-140391-REVIEW-ONLY.tar.zst -C staged-site
          test -f staged-site/student-english.html
          test -f staged-site/assets/styles.css
          test -f staged-site/_headers
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('og-report-source/OG_V23_4_FINAL_QA.json').read_text())
          assert report['status']=='PASS_V23_4_OG_FULL_SITE_QA'
          assert report['html_total']==140393
          assert report['correct_meta']==140393
          print('PASS_OG_SOURCE_UNCHANGED',report['correct_meta'])
          PY
      - name: Patch full 140391 HTML student blocks with correct six-card mapping
        id: patch
        run: |
          set -euo pipefail
          python3 scripts/v23_4_fix_student_navigation_all.py \
            --root staged-site --source-hub student-english.html --expected 140391 \
            --report student-nav-report/V23_4_STUDENT_NAV_FULL_PATCH.json
      - name: Independent all-page post-patch label / order / href / OG QA
        id: audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,html,sys
          from pathlib import Path
          root=Path('staged-site')
          p=Path('student-nav-report/V23_4_STUDENT_NAV_AUDIT.json')
          original=json.loads(Path('student-nav-report/V23_4_STUDENT_NAV_FULL_PATCH.json').read_text())
          pattern=re.compile(r'<article class="related-group"><h3>학생 영어</h3><div class="related-course-links">(.*?)</div></article>',re.S)
          anchor=re.compile(r'<a\b[^>]*>.*?</a>',re.S)
          labels=['초등학생영어과외','중학생영어과외','고등학생영어과외',
                  '초등학생영어회화','중학생영어회화','고등학생영어회화']
          expected_hrefs=[
              None,'/student-english.html#middle-tutor','/student-english.html#high-tutor',
              '/student-english.html#elementary','/student-english.html#middle','/student-english.html#high']
          errors=[]
          checked=0;groups=0;links=0;og=0
          pages=sorted(root.glob('*.html'))
          for page in pages:
            checked+=1
            text=page.read_text(encoding='utf-8',errors='replace')
            if text.count('property="og:image"')==1:
              og+=1
            else:
              if len(errors)<200:errors.append([page.name,'OG meta changed or missing'])
            match=pattern.findall(text)
            if not match:
              continue
            groups+=1
            if len(match)!=1:
              if len(errors)<200:errors.append([page.name,'duplicate student block'])
              continue
            cards=anchor.findall(match[0])
            if len(cards)!=6:
              if len(errors)<200:errors.append([page.name,'wrong student card count '+str(len(cards))])
              continue
            links+=6
            for i,a in enumerate(cards):
              label=html.unescape(re.sub(r'<[^>]+>','',re.search(r'<span>(.*?)</span>',a,re.S).group(1)))
              expected=labels[i]
              if expected not in label or any(w in label for w in (labels[j] for j in range(6) if j!=i)):
                if len(errors)<200:errors.append([page.name,'incorrect card label',i,label])
              href=re.search(r'\bhref="([^"]+)"',a)
              if not href:
                if len(errors)<200:errors.append([page.name,'missing href',i])
              elif expected_hrefs[i] is not None and href.group(1)!=expected_hrefs[i]:
                if len(errors)<200:errors.append([page.name,'wrong href',i,href.group(1)])
              elif i==0 and not (
                href.group(1).endswith('-elem-tutor.html')
                or href.group(1)=='/student-english.html#elementary-tutor'
              ):
                if len(errors)<200:errors.append([page.name,'wrong elementary tutor href',href.group(1)])
            if checked%25000==0:print('NAV_FINAL_AUDIT_PROGRESS',checked,groups,flush=True)
          if len(pages)!=140393:errors.append(['(all)','html_count',len(pages)])
          if groups!=original['student_groups_found']:errors.append(['(all)','coverage_mismatch',groups])
          if og!=len(pages):errors.append(['(all)','OG preservation mismatch',og])
          if groups < 1000:errors.append(['(all)','too few student groups',groups])
          report={'status':'PASS_V23_4_STUDENT_NAV_FULL_QA' if not errors else 'FAIL_V23_4_STUDENT_NAV_FULL_QA',
                  'html_scanned':checked,'student_blocks_checked':groups,'student_links_checked':links,
                  'og_meta_preserved':og,'errors_count':len(errors),'errors':errors,
                  'production_deployed':False,'netlify_deployed':False}
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(report['status'],'pages',checked,'groups',groups,'links',links,'errors',len(errors))
          if errors:
            for e in errors[:15]:print('::error::'+str(e))
            sys.exit(1)
          PY
      - name: Create eight-page reviewer examples from corrected release
        id: samples
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json
          from pathlib import Path
          root=Path('staged-site')
          names=['student-english.html','englishpt.html','assets/styles.css','assets/site.js',
                 'seoul-jongno-sajikdong-worker-english-conv-academy.html',
                 'seoul-jongno-sajikdong-elem-tutor.html',
                 'seoul-jongno-sajikdong-mid-conv.html',
                 'seoul-jongno-sajikdong-high-conv.html',
                 'station-gangnam.html','dalseo-songhyeondong.html']
          available=[n for n in names if (root/n).is_file()]
          with zipfile.ZipFile('student-nav-report/ENGLISHPT_V23_4_STUDENT_NAV_SAMPLES.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in available:z.write(root/name,name)
          print('PASS_STUDENT_NAV_REVIEW_SAMPLES',len(available))
          PY
      - name: Package corrected 140391-page review-only release
        id: package
        run: |
          set -euo pipefail
          tar -I 'zstd -T0 -3' -cf englishpt-v23-4-student-nav-corrected-OG-140391-REVIEW-ONLY.tar.zst -C staged-site .
          sha256sum englishpt-v23-4-student-nav-corrected-OG-140391-REVIEW-ONLY.tar.zst > student-nav-report/STUDENT_NAV_RELEASE_SHA256.txt
          echo PASS_CORRECTED_STUDENT_NAV_REVIEW_PACKAGE
      - name: Final report summary, including original source and safety status
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          CHECKSUM_OUTCOME: ${{ steps.checksum.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          SAMPLES_OUTCOME: ${{ steps.samples.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          d=Path('student-nav-report');d.mkdir(exist_ok=True)
          keys=['SOURCE','DOWNLOAD','CHECKSUM','EXTRACT','PATCH','AUDIT','SAMPLES','PACKAGE']
          stages={x:os.environ.get(x+'_OUTCOME','unknown') for x in keys}
          patch=d/'V23_4_STUDENT_NAV_FULL_PATCH.json'
          qa=d/'V23_4_STUDENT_NAV_AUDIT.json'
          p=json.loads(patch.read_text()) if patch.exists() else {}
          q=json.loads(qa.read_text()) if qa.exists() else {}
          passed=all(x=='success' for x in stages.values()) and q.get('status')=='PASS_V23_4_STUDENT_NAV_FULL_QA'
          status='PASS_V23_4_STUDENT_NAV_ALL_REVIEW_ONLY' if passed else 'HOLD_V23_4_STUDENT_NAV_ALL_REVIEW_ONLY'
          report={'status':status,'stages':stages,'source_run':'38689660290',
            'source_sha':'a18b8901ecda7d37f65e35b15f03d579ec63c70f',
            'og_source_run':'38766832143',
            'groups_modified':p.get('student_groups_modified'),
            'links_checked':q.get('student_links_checked'),
            'audit_failures':q.get('errors_count'),
            'netlify_deployed':False,'production_deployed':False,'form_submitted':False}
          (d/'RUN_STATUS.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
            f.write(f"## Student navigation full QA: {status}\n\nSource Run 38689660290; SHA a18b8901ecda7d37f65e35b15f03d579ec63c70f\n\n")
            f.write(f"Stages: {stages}\n\nCorrected groups: {report['groups_modified']}; links checked: {report['links_checked']}; errors: {report['audit_failures']}\n\n")
            f.write('Review artifacts only; no Netlify or Production deploy; no form submissions.\n')
          print(status,stages,flush=True)
          PY
      - name: Always upload full QA reports and sample pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23-4-student-nav-corrected-QA
          path: student-nav-report/
          retention-days: 30
          if-no-files-found: error
      - name: Upload complete corrected review site only after PASS
        if: steps.audit.outcome == 'success' && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23-4-student-nav-corrected-OG-full-site-REVIEW-ONLY
          path: englishpt-v23-4-student-nav-corrected-OG-140391-REVIEW-ONLY.tar.zst
          retention-days: 30
          if-no-files-found: error
