name: ENPT P1 1816 Actual Live Enhanced Draft Duplicate SEO Check
on:
  push:
    branches: [qa/enpt-p1-1815-stations-ux-official15-20261021]
    paths: [.github/workflows/ENPT-20261021-P1-1816-DUPLICATE-LIVE-READONLY.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: enpt-p1-1816-copy-qa-readonly-20261021
  cancel-in-progress: false
jobs:
  compare-no-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/enpt-p1-1815-stations-ux-official15-20261021
      - name: Source immutable and no-write static QA
        run: |
          python3 -m py_compile scripts/ENPT_20261021_P1_1816_LIVE_SOURCE_COMPARISON_GETONLY.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("scripts/ENPT_20261021_P1_1816_LIVE_SOURCE_COMPARISON_GETONLY.py").read_text()
          for bad in ("netlify deploy","requests.post","--prod","method=\"POST\""):
            assert bad not in s,bad
          print("PASS_READONLY")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-SHARDED-EDGE-FULL-158571-CANDIDATE-NO-DRAFT-NO-PROD
          run-id: 39194321977
          github-token: ${{ github.token }}
          path: frozen-source
      - name: Compare every original P0 HTML with actual Draft HTTP GET
        run: |
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
          python3 scripts/ENPT_20261021_P1_1816_LIVE_SOURCE_COMPARISON_GETONLY.py
      - name: Save actual per-URL comparisons even when incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENPT_20261021_P1_1816_LIVE_ORIGINAL_TO_DRAFT_CONTENT_AUDIT
          path: p1-1816-before-after-readonly/
          retention-days: 90
          if-no-files-found: warn
