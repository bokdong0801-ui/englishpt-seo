              assert metrics['viewport']['height']==844,(name,metrics)
              assert metrics['hero'] and metrics['visual'] and metrics['intro'] and metrics['actions'],(name,metrics)
              assert abs(metrics['visual']['top']-metrics['hero']['bottom']) <= 3,(name,metrics)
              assert metrics['actions']['height'] <= 62,(name,metrics)
              assert metrics['hero']['height'] <= 315,(name,metrics)
              assert metrics['visual']['height'] <= 330,(name,metrics)
              is_exam=any(token in name for token in ['-toeic.html','-toeic-speaking.html','-opic.html','-ielts.html','-duolingo.html','-toefl.html'])
              if is_exam:
                  assert metrics['beginner'],(name,metrics)
                  assert abs(metrics['beginner']['top']-metrics['visual']['bottom']) <= 3,(name,metrics)
                  assert metrics['beginner']['top'] <= 700,(name,metrics)
                  assert metrics['beginner']['height'] <= 310,(name,metrics)
                  assert metrics['intro']['top'] <= 980,(name,metrics)
              else:
                  assert metrics['intro']['top'] <= 820,(name,metrics)
              rows.append({'page':name,**metrics,'screenshot':str(shot_path)})
          tab.stop()
          browser.close_tab(tab)
          report={
              'status':'PASS_MOBILE_FIRST_SCREEN_QA',
              'viewport':'390x844 CSS px',
              'rule':'Conversation: Hero -> image -> intro within 820px. Exams: Hero -> image -> beginner guide -> intro within 980px; beginner guide begins within the first 700px so meaningful content remains visible in the first 844px viewport.',
              'pages':rows,
          }
          Path('STAGE9_MOBILE_FIRST_SCREEN_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
