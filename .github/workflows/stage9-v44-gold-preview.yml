          # Home: Seoul -> Jongno -> Sajikdong -> TOEIC must open the generated locality page.
          nav('englishpt.html',1.2)
          count=val("document.querySelector('[data-region-sido]').options.length")
          assert count and count>10,count
          val("""(()=>{const e=document.querySelector('[data-region-sido]');e.value='서울특별시';e.dispatchEvent(new Event('change',{bubbles:true}));return true})()""")
          val("""(()=>{const e=document.querySelector('[data-region-jurisdiction]');e.value='서울특별시 종로구';e.dispatchEvent(new Event('change',{bubbles:true}));return [...e.options].map(x=>x.value)})()""")
          dong_values=val("[...document.querySelector('[data-region-dong]').options].map(x=>x.value)")
          assert 'seoul-jongno-sajikdong' in dong_values,dong_values[:20]
          val("""(()=>{document.querySelector('[data-region-dong]').value='seoul-jongno-sajikdong';document.querySelector('[data-region-intent]').value='toeic';document.querySelector('[data-region-go]').click();return true})()""")
          time.sleep(0.8)
