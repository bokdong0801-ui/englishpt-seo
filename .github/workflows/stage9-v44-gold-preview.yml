              height=844,
              deviceScaleFactor=1,
              mobile=False,
              screenWidth=390,
              screenHeight=844,
              dontSetVisibleSize=False,
          )
          expression=r'''(()=>{
            const box=(s)=>{
              const e=document.querySelector(s);
              if(!e)return null;
              const r=e.getBoundingClientRect();
              return {top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height),width:Math.round(r.width)};
            };
            return {
              viewport:{width:window.innerWidth,height:window.innerHeight,dpr:window.devicePixelRatio},
              hero:box('.hero.simple-hero'),
              actions:box('.hero-actions'),
              visual:box('.visual-break'),
              figure:box('.learning-visual'),
              caption:box('.learning-visual figcaption'),
              beginner:box('.beginner-exam-guide'),
              intro:box('.section.intro-detail')
            };
          })()'''
          rows=[]
          for i,name in enumerate(targets,1):
              url='http://127.0.0.1:8765/'+name
