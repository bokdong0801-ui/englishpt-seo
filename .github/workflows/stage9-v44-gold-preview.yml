name: Stage 9 V4.4 Gold Netlify Preview

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'stage9-v44-preview-trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || secrets.ENGLISHPT_NETLIFY_SITE_ID || vars.NETLIFY_SITE_ID || vars.ENGLISHPT_NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install search image rasterizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk


      - name: Verify preview credentials
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"

      - name: Download approved Stage 7 source
        uses: actions/download-artifact@v4
        with:
          name: stage7-deploy-preview-rollback
          path: stage7-source
          run-id: 36694432423
          github-token: ${{ github.token }}

      - name: Download approved Stage 8 packet
        uses: actions/download-artifact@v4
        with:
          name: stage8-production-approval-packet
          path: stage8-source
          run-id: 36694845460
          github-token: ${{ github.token }}

      - name: Extract all proven Stage 5 source pages
        run: |
          command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zstd)
          mkdir -p stage9-work
          mapfile -t PKGS < <(find stage7-source -name 'stage5-shard-*-of-026.tar.zst' | sort)
          test "${#PKGS[@]}" -eq 26
          for f in "${PKGS[@]}"; do
            tar --zstd -xf "$f" -C stage9-work
          done
          test "$(find stage9-work/stage5-full-generation -name '*.html' | wc -l)" -eq 66937

      - name: Assemble exact current Production output
        run: |
          python3 scripts/build-stage9-production-release.py \
            --stage7-root stage7-source/stage7-preview \
            --stage8-root stage8-source \
            --work-root stage9-work \
            --output stage9-release
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('stage9-release/STAGE9_PRODUCTION_RELEASE_QA_V1.json').read_text(encoding='utf-8'))
          assert q['status']=='PASS_STAGE9_RELEASE_ASSEMBLED_READY_TO_DEPLOY', q
          assert q['counts']['html_total']==140391, q
          assert q['indexing']['production_ui_failures']==0, q
          assert q['source']['mass_renderer']=='stage9-clean-gold-v1', q
          print('PASS_EXACT_PRODUCTION_ASSEMBLY')
          PY

      - name: Build 23-page reader-first preview from exact renderer output
        run: |
          rm -rf stage9-v44-preview
          mkdir -p stage9-v44-preview
          cp -a stage9-release/. stage9-v44-preview/
          test "$(find stage9-v44-preview -maxdepth 1 -name '*.html' | wc -l)" -ge 140391
          python3 - <<'PY'
          import html, json, shutil
          from pathlib import Path
          q=json.loads(Path('stage7-source/stage7-preview/STAGE7_DEPLOY_PREVIEW_QA_V1.json').read_text(encoding='utf-8'))
          out=Path('stage9-v44-preview')
          pages=[]
          for row in q['representative_13']['pages']:
              name=row['canonical'].rsplit('/',1)[-1]
              src=Path('stage9-release')/name
              assert src.exists(), name
              raw=src.read_text(encoding='utf-8')
              assert 'class="site-header"' in raw, name
              assert 'class="hero simple-hero"' in raw, name
              assert 'class="snapshot"' in raw, name
              assert 'class="trust"' in raw, name
              title=raw.split('<title>',1)[1].split('</title>',1)[0]
              assert 'ENGLISH PT' not in title, (name,title)
              shutil.copy2(src,out/name)
              pages.append((name,title,'기존'))
          academy_bases=['toeic','toeic-speaking','opic','ielts','duolingo','toefl']
          academy_names=[]
          for base in academy_bases:
              source=next((name for name,_,_ in pages if name.endswith(f'-{base}.html')),None)
              assert source, base
              academy=source[:-len(base+'.html')] + base + '-academy.html'
              src=Path('stage9-release')/academy
              assert src.exists(), academy
              raw=src.read_text(encoding='utf-8')
              assert 'class="section academy-choice"' in raw, academy
              assert 'intent-academy' in raw, academy
              title=raw.split('<title>',1)[1].split('</title>',1)[0]
              assert '학원' in title, (academy,title)
              shutil.copy2(src,out/academy)
              pages.append((academy,title,'학원검색'))
              academy_names.append(academy)
          conv_specs=[
              ('housewife-conv','english-conv-academy','회화학원'),
              ('housewife-conv','adult-english-conv-academy','회화학원'),
              ('biz-business-conv','worker-english-conv-academy','회화학원'),
              ('housewife-conv','beginner-english-conv','왕초보'),
          ]
          for base_intent,derived,kind in conv_specs:
              source=next((name for name,_,_ in pages if name.endswith(f'-{base_intent}.html')),None)
              assert source, base_intent
              name=source[:-len(base_intent+'.html')] + derived + '.html'
              src=Path('stage9-release')/name
              assert src.exists(), name
              raw=src.read_text(encoding='utf-8')
              title=raw.split('<title>',1)[1].split('</title>',1)[0]
              if derived.endswith('-academy'):
                  assert 'class="section academy-choice"' in raw, name
                  assert 'intent-academy' in raw, name
                  assert '학원' in title, (name,title)
              else:
                  assert 'intent-audience' in raw, name
                  assert '왕초보영어회화' in title, (name,title)
              shutil.copy2(src,out/name)
              pages.append((name,title,kind))
              academy_names.append(name)
          assert len(pages)==23, len(pages)
          cards=''.join(
              f'<a class="card" href="/{html.escape(name)}"><small>{html.escape(kind)}</small><b>{html.escape(title)}</b><span>페이지 열기 →</span></a>'
              for name,title,kind in pages
          )
          index=f'''<!doctype html><html lang="ko"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>ENGLISH PT 23개 최종 후보 Preview</title>
          <style>
          *{{box-sizing:border-box}}body{{margin:0;font-family:Pretendard,"Apple SD Gothic Neo",Arial,sans-serif;background:#F5F2EA;color:#14201A}}
          .wrap{{width:min(1050px,calc(100% - 36px));margin:0 auto;padding:54px 0}}
          h1{{font-size:clamp(30px,5vw,52px);line-height:1.12;margin:0 0 12px}}p{{color:#66716B;line-height:1.7}}
          .note{{background:#fff;border:1px solid #D7DDD8;border-radius:18px;padding:18px;margin:24px 0}}
          .grid{{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}}
          .card{{display:grid;gap:7px;background:#fff;border:1px solid #D7DDD8;border-radius:17px;padding:18px;color:inherit;text-decoration:none}}
          .card small{{font-size:10px;font-weight:900;letter-spacing:.08em;color:#7A817D}}.card b{{font-size:15px}}.card span{{font-size:12px;color:#315F4C;font-weight:800}}
          @media(max-width:700px){{.grid{{grid-template-columns:1fr}}.wrap{{padding:36px 0}}}}
          </style></head><body><main class="wrap"><p>NETLIFY PREVIEW · 실제 Production renderer 산출물</p>
          <h1>V4.4 + Reader-first + 23개 검색의도</h1>
          <p>기존 13개 대표 페이지, 시험 학원 검색 페이지 6개, 영어회화학원·성인영어회화학원·직장인영어회화학원·왕초보영어회화 4개를 같은 Production 생성기에서 뽑았습니다.</p>
          <div class="note"><b>확인 포인트</b><p>시험별 색상 변화, 첫 화면의 가독성, 학원 검색 페이지의 비교 설명, 관리 과정, PC/모바일 반응형을 확인해주세요. 이 Preview는 검색엔진 색인을 막아두었습니다.</p></div>
          <p><a href="/image-review.html" style="display:inline-block;padding:12px 16px;border-radius:999px;background:#14201A;color:#fff;text-decoration:none;font-weight:900">대표이미지 후보 27개 비교하기 →</a></p>
          <div class="grid">{cards}</div></main></body></html>'''
          (out/'review-index.html').write_text(index,encoding='utf-8')

          image_specs=[
              ('toeic','토익'),
              ('toeic-speaking','토익스피킹'),
              ('opic','오픽'),
              ('ielts','아이엘츠'),
              ('toefl','토플'),
              ('english-conv','영어회화'),
              ('adult-conv','성인영어회화'),
              ('worker-conv','직장인영어회화'),
              ('beginner-conv','왕초보영어회화'),
          ]
          image_cards=[]
          for family,label in image_specs:
              options=''.join(
                  f'<figure><img src="/assets/images/representative/{family}-{v}.svg" alt="{html.escape(label)} 대표이미지 후보 {v}"><figcaption>{html.escape(label)} 후보 {v}</figcaption></figure>'
                  for v in (1,2,3)
              )
              image_cards.append(f'<section><h2>{html.escape(label)}</h2><div class="image-grid">{options}</div></section>')
          image_review=f'''<!doctype html><html lang="ko"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>ENGLISH PT 대표이미지 후보 비교</title>
          <style>
          *{{box-sizing:border-box}}body{{margin:0;font-family:Pretendard,"Apple SD Gothic Neo",Arial,sans-serif;background:#F7F5EF;color:#14201A}}
          .wrap{{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:46px 0}}
          a{{color:#315F4C;font-weight:900;text-decoration:none}}h1{{font-size:clamp(30px,5vw,50px);margin:8px 0 14px}}
          h2{{font-size:22px;margin:34px 0 12px}}p{{color:#66716B;line-height:1.7}}
          .image-grid{{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}}
          figure{{margin:0;background:#fff;border:1px solid #D7DDD8;border-radius:18px;overflow:hidden}}
          img{{display:block;width:100%;height:auto;aspect-ratio:5/3;object-fit:cover}}
          figcaption{{padding:12px 14px;font-size:13px;font-weight:800}}
          @media(max-width:760px){{.image-grid{{grid-template-columns:1fr}}.wrap{{padding:30px 0}}}}
          </style></head><body><main class="wrap"><a href="/">← Preview 목록으로</a>
          <h1>대표이미지 후보 27개</h1>
          <p>토익·토스·OPIc·IELTS·TOEFL·영어회화·성인·직장인·왕초보 9개 키워드군마다 3개씩 비교할 수 있습니다. 실제 각 페이지에는 현재 후보 1~2 중 하나를 기본 이미지로 연결해두었습니다.</p>
          {''.join(image_cards)}</main></body></html>'''
          (out/'image-review.html').write_text(image_review,encoding='utf-8')
          (out/'_headers').write_text('/*\n  X-Robots-Tag: noindex, nofollow\n',encoding='utf-8')
          (out/'ACADEMY_PREVIEW_PAGES.json').write_text(json.dumps(academy_names,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Audit full preview navigation graph
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('stage9-v44-preview')
          assert (root/'assets'/'locality-index.json').exists()
          localities=json.loads((root/'assets'/'locality-index.json').read_text(encoding='utf-8'))
          assert len(localities)==5149,len(localities)

          # Every one of the 23 Dobongsan station links must resolve in the preview.
          dobong=(root/'station-dobongsan.html').read_text(encoding='utf-8')
          station_links=re.findall(r'href="(/station-dobongsan-[^"]+\.html)"',dobong)
          assert len(station_links)==23,('dobongsan_station_links',len(station_links),station_links)
          for href in station_links:
              assert (root/href.lstrip('/')).exists(),('missing_dobongsan_target',href)
          print('PASS_NAV_AUDIT_DOBONGSAN_23')

          # Representative localities must be reachable and must expose onward navigation.
          samples=[
              'seoul-jongno-sajikdong-toeic.html',
              'daegu-dalseo-songhyeondong-toeic.html',
              'busan-dongnae-sajikdong-english-conv-academy.html',
          ]
          for name in samples:
              p=root/name
              assert p.exists(),name
              raw=p.read_text(encoding='utf-8')
              assert '같은 지역 · 다른 과정' in raw,name
              assert '다른 동네' in raw,name
              assert '전체 과정 찾기' in raw,name
              assert '911개 역으로 찾기' in raw,name
              hrefs=re.findall(r'href="(/[^"]+\.html)"',raw)
              for href in hrefs:
                  if href.startswith('/station-') or any(x in href for x in ('sajikdong','songhyeondong')):
                      assert (root/href.lstrip('/')).exists(),(name,href)

          print('PASS_NAV_AUDIT_LOCALITY_SAMPLES')

          # National hubs must have the region selector, complete relevant intent sets, and teacher trust.
          expected_options={
              'englishpt.html':23,'courses.html':23,'english-conversation.html':8,
              'exam-english.html':12,'student-english.html':3,
          }
          for name,expected in expected_options.items():
              raw=(root/name).read_text(encoding='utf-8')
              assert 'data-region-finder' in raw,name
              assert '영어권 교포 선생님' in raw,name
              m=re.search(r'<select data-region-intent>(.*?)</select>',raw,re.S)
              assert m,name
              values=[x for x in re.findall(r'<option value="([^"]*)"',m.group(1)) if x]
              assert len(values)==expected,(name,len(values),expected)
              assert len(set(values))==len(values),(name,'duplicate_intents')

          print('PASS_NAV_AUDIT_NATIONAL_HUBS')
          home=(root/'englishpt.html').read_text(encoding='utf-8')
          assert '전체지역·과정 바로가기' in home
          assert '과정 중심 탐색과 겹치지 않도록' in home
          assert home.index('과정 찾기') < home.index('전체지역·과정 바로가기')

          print('PASS_NAV_AUDIT_HOME_SEPARATION')

          # Preserved Songhyeondong pages must connect into the nationwide navigation graph too.
          preserved=root/'dalseo-songhyeondong-adult-conv.html'
          assert preserved.exists()
          preserved_raw=preserved.read_text(encoding='utf-8')
          assert 'preserved-region-navigation' in preserved_raw
          assert 'data-region-finder' in preserved_raw
          pm=re.search(r'<select data-region-intent>(.*?)</select>',preserved_raw,re.S)
          assert pm
          pvalues=[x for x in re.findall(r'<option value="([^"]*)"',pm.group(1)) if x]
          assert len(pvalues)==23,len(pvalues)
          assert 'dalseo-songhyeondong-adult-tutor.html' in preserved_raw
          assert '/englishpt.html#region' in preserved_raw
          assert '/stations.html' in preserved_raw

          print('PASS_NAV_AUDIT_PRESERVED_SONGHYEONDONG')
          styles=(root/'assets'/'styles.css').read_text(encoding='utf-8')
          assert '.station-hub-page .station-hero' in styles
          assert '.region-finder-shell' in styles
          assert '.teacher-trust-grid' in styles
          print('PASS_NAV_AUDIT_STYLES')
          print('PASS_FULL_PREVIEW_LINK_GRAPH')
          PY

      - name: Audit main national hubs and five beginner exam pages
        run: |
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path

          root=Path('stage9-v44-preview')
          q=json.loads(Path('stage7-source/stage7-preview/STAGE7_DEPLOY_PREVIEW_QA_V1.json').read_text(encoding='utf-8'))
          base_names=[row['canonical'].rsplit('/',1)[-1] for row in q['representative_13']['pages']]

          def by_suffix(suffix):
              return next(name for name in base_names if name.endswith('-'+suffix+'.html'))

          toeic=by_suffix('toeic')
          toeic_speaking=by_suffix('toeic-speaking')
          opic=by_suffix('opic')
          ielts=by_suffix('ielts')
          duolingo=by_suffix('duolingo')
          toefl=by_suffix('toefl')
          housewife=by_suffix('housewife-conv')
          conv=housewife[:-len('housewife-conv.html')]+'english-conv-academy.html'

          def one(name):
              p=root/name
              raw=p.read_text(encoding='utf-8')
              def first(pattern, flags=re.I|re.S):
                  m=re.search(pattern,raw,flags)
                  return html.unescape(re.sub(r'<[^>]+>','',m.group(1))).strip() if m else None
              form=''
              fm=re.search(r'<form id="leadForm"[^>]*>(.*?)</form>',raw,re.I|re.S)
              if fm: form=fm.group(1)
              img=re.search(r'<figure class="learning-visual">.*?<img[^>]*src="([^"]+)"[^>]*alt="([^"]*)"[^>]*>.*?(?:<figcaption>(.*?)</figcaption>)?.*?</figure>',raw,re.I|re.S)
              return {
                'file':name,
                'title':first(r'<title>(.*?)</title>'),
                'description':first(r'<meta name="description" content="([^"]*)"'),
                'canonical':first(r'<link rel="canonical" href="([^"]*)"'),
                'h1':first(r'<h1>(.*?)</h1>'),
                'image_src':html.unescape(img.group(1)) if img else None,
                'image_alt':html.unescape(img.group(2)) if img else None,
                'image_caption':html.unescape(re.sub(r'<[^>]+>','',img.group(3))).strip() if img and img.group(3) else None,
                'form_fields':sorted(set(re.findall(r'name="([^"]+)"',form))),
                'has_purpose': 'name="purpose"' in form,
                'has_difficulty': 'name="difficulty"' in form,
                'internal_links': raw.count('href="/'),
                'hero_index': raw.index('class="hero simple-hero"'),
                'visual_index': raw.index('class="visual-break"'),
                'intro_index': raw.index('class="section intro-detail"'),
                'visual_count': raw.count('class="visual-break"'),
                'image_loading_eager': 'loading="eager"' in raw,
                'markers': {
                  'site_header':'class="site-header"' in raw,
                  'hero':'class="hero simple-hero"' in raw,
                  'snapshot':'class="snapshot"' in raw,
                  'trust':'class="trust"' in raw,
                  'management':'class="section management"' in raw,
                  'learning_visual':'class="learning-visual"' in raw,
                }
              }

          home_raw=(root/'englishpt.html').read_text(encoding='utf-8')
          def hfirst(pattern):
              m=re.search(pattern,home_raw,re.I|re.S)
              return html.unescape(re.sub(r'<[^>]+>','',m.group(1))).strip() if m else None
          home_form=re.search(r'<form id="leadForm"[^>]*>(.*?)</form>',home_raw,re.I|re.S)
          hf=home_form.group(1) if home_form else ''
          report={
            'home':{
              'file':'englishpt.html',
              'title':hfirst(r'<title>(.*?)</title>'),
              'description':hfirst(r'<meta name="description" content="([^"]*)"'),
              'canonical':hfirst(r'<link rel="canonical" href="([^"]*)"'),
              'h1':hfirst(r'<h1>(.*?)</h1>'),
              'form_fields':sorted(set(re.findall(r'name="([^"]+)"',hf))),
              'has_purpose':'name="purpose"' in hf,
              'has_difficulty':'name="difficulty"' in hf,
              'schema_fixed_songhyeondong':'"areaServed":{"@type":"AdministrativeArea","name":"대구 달서구 송현동"}' in home_raw,
              'footer_fixed_songhyeondong':'대구 달서구 송현동 · 1:1 맞춤 영어관리' in home_raw,
              'form_default_songhyeondong':'value="송현동"' in hf,
            },
            'toeic':one(toeic),
            'toeic_speaking':one(toeic_speaking),
            'opic':one(opic),
            'ielts':one(ielts),
            'duolingo':one(duolingo),
            'toefl':one(toefl),
            'english_conversation':one(conv),
            'national_hubs':{
              name:{
                'exists':(root/name).exists(),
                'canonical_ok':f'https://englishpt.kr/{name}' in (root/name).read_text(encoding='utf-8'),
                'songhyeondong':('songhyeondong' in (root/name).read_text(encoding='utf-8').lower() or '송현동' in (root/name).read_text(encoding='utf-8')),
              }
              for name in ('courses.html','english-conversation.html','exam-english.html','student-english.html')
            },
            'station_samples':{
              name:{
                'exists':(root/name).exists(),
                'canonical':(
                  re.search(r'<link rel="canonical" href="([^"]+)"',(root/name).read_text(encoding='utf-8'),re.I).group(1)
                  if re.search(r'<link rel="canonical" href="([^"]+)"',(root/name).read_text(encoding='utf-8'),re.I)
                  else None
                ),
              }
              for name in ('stations.html','station-dobongsan.html','station-dobongsan-toeic.html','station-dobongsan-english-conv-academy.html','station-gangnam.html')
            },
          }
          assert report['home']['title']=='1:1 영어과외·영어회화·시험영어 | 잉글리시PT',report['home']
          assert '1:1 영어과외·영어회화부터' in report['home']['description'],report['home']
          assert report['home']['schema_fixed_songhyeondong'] is False,report['home']
          assert report['home']['footer_fixed_songhyeondong'] is False,report['home']
          assert report['home']['form_default_songhyeondong'] is False,report['home']
          assert '전체지역·과정 바로가기' in home_raw
          assert 'data-region-finder' in home_raw
          assert '지역별 과정 페이지 보기' in home_raw
          assert '911개 역으로 찾기' in home_raw
          for station_link in ('station-gangnam.html','station-dobongsan.html','station-busan.html','station-suwon.html'):
