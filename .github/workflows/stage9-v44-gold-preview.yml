name: Stage 9 V4.4 Gold Netlify Preview

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'stage9-v44-preview-trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || secrets.ENGLISHPT_NETLIFY_SITE_ID || vars.NETLIFY_SITE_ID || vars.ENGLISHPT_NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify preview credentials
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"

      - name: Download approved Stage 7 source
        uses: actions/download-artifact@v4
        with:
          name: stage7-deploy-preview-rollback
          path: stage7-source
          run-id: 36694432423
          github-token: ${{ github.token }}

      - name: Download approved Stage 8 packet
        uses: actions/download-artifact@v4
        with:
          name: stage8-production-approval-packet
          path: stage8-source
          run-id: 36694845460
          github-token: ${{ github.token }}

      - name: Extract all proven Stage 5 source pages
        run: |
          command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zstd)
          mkdir -p stage9-work
          mapfile -t PKGS < <(find stage7-source -name 'stage5-shard-*-of-026.tar.zst' | sort)
          test "${#PKGS[@]}" -eq 26
          for f in "${PKGS[@]}"; do
            tar --zstd -xf "$f" -C stage9-work
          done
          test "$(find stage9-work/stage5-full-generation -name '*.html' | wc -l)" -eq 66937

      - name: Assemble exact current Production output
        run: |
          python3 scripts/build-stage9-production-release.py \
            --stage7-root stage7-source/stage7-preview \
            --stage8-root stage8-source \
            --work-root stage9-work \
            --output stage9-release
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('stage9-release/STAGE9_PRODUCTION_RELEASE_QA_V1.json').read_text(encoding='utf-8'))
          assert q['status']=='PASS_STAGE9_RELEASE_ASSEMBLED_READY_TO_DEPLOY', q
          assert q['counts']['html_total']==113373, q
          assert q['indexing']['production_ui_failures']==0, q
          assert q['source']['mass_renderer']=='stage9-clean-gold-v1', q
          print('PASS_EXACT_PRODUCTION_ASSEMBLY')
          PY

      - name: Build 22-page reader-first preview from exact renderer output
        run: |
          rm -rf stage9-v44-preview
          mkdir -p stage9-v44-preview
          cp stage9-release/pilot.css stage9-v44-preview/
          cp stage9-release/pilot.js stage9-v44-preview/
          cp stage9-release/englishpt.html stage9-v44-preview/ 2>/dev/null || true
          python3 - <<'PY'
          import html, json, shutil
          from pathlib import Path
          q=json.loads(Path('stage7-source/stage7-preview/STAGE7_DEPLOY_PREVIEW_QA_V1.json').read_text(encoding='utf-8'))
          out=Path('stage9-v44-preview')
          pages=[]
          for row in q['representative_13']['pages']:
              name=row['canonical'].rsplit('/',1)[-1]
              src=Path('stage9-release')/name
              assert src.exists(), name
              raw=src.read_text(encoding='utf-8')
              assert 'class="site-header"' in raw, name
              assert 'class="hero simple-hero"' in raw, name
              assert 'class="snapshot"' in raw, name
              assert 'class="trust"' in raw, name
              title=raw.split('<title>',1)[1].split('</title>',1)[0]
              assert 'ENGLISH PT' not in title, (name,title)
              shutil.copy2(src,out/name)
              pages.append((name,title,'기존'))
          academy_bases=['toeic','toeic-speaking','opic','ielts','toefl']
          academy_names=[]
          for base in academy_bases:
              source=next((name for name,_,_ in pages if name.endswith(f'-{base}.html')),None)
              assert source, base
              academy=source[:-len(base+'.html')] + base + '-academy.html'
              src=Path('stage9-release')/academy
              assert src.exists(), academy
              raw=src.read_text(encoding='utf-8')
              assert 'class="section academy-choice"' in raw, academy
              assert 'intent-academy' in raw, academy
              title=raw.split('<title>',1)[1].split('</title>',1)[0]
              assert '학원' in title, (academy,title)
              shutil.copy2(src,out/academy)
              pages.append((academy,title,'학원검색'))
              academy_names.append(academy)
          conv_specs=[
              ('housewife-conv','english-conv-academy','회화학원'),
              ('housewife-conv','adult-english-conv-academy','회화학원'),
              ('biz-business-conv','worker-english-conv-academy','회화학원'),
              ('housewife-conv','beginner-english-conv','왕초보'),
          ]
          for base_intent,derived,kind in conv_specs:
              source=next((name for name,_,_ in pages if name.endswith(f'-{base_intent}.html')),None)
              assert source, base_intent
              name=source[:-len(base_intent+'.html')] + derived + '.html'
              src=Path('stage9-release')/name
              assert src.exists(), name
              raw=src.read_text(encoding='utf-8')
              title=raw.split('<title>',1)[1].split('</title>',1)[0]
              if derived.endswith('-academy'):
                  assert 'class="section academy-choice"' in raw, name
                  assert 'intent-academy' in raw, name
                  assert '학원' in title, (name,title)
              else:
                  assert 'intent-audience' in raw, name
                  assert '왕초보영어회화' in title, (name,title)
              shutil.copy2(src,out/name)
              pages.append((name,title,kind))
              academy_names.append(name)
          assert len(pages)==22, len(pages)
          cards=''.join(
              f'<a class="card" href="/{html.escape(name)}"><small>{html.escape(kind)}</small><b>{html.escape(title)}</b><span>페이지 열기 →</span></a>'
              for name,title,kind in pages
          )
          index=f'''<!doctype html><html lang="ko"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>ENGLISH PT 22개 최종 후보 Preview</title>
          <style>
          *{{box-sizing:border-box}}body{{margin:0;font-family:Pretendard,"Apple SD Gothic Neo",Arial,sans-serif;background:#F5F2EA;color:#14201A}}
          .wrap{{width:min(1050px,calc(100% - 36px));margin:0 auto;padding:54px 0}}
          h1{{font-size:clamp(30px,5vw,52px);line-height:1.12;margin:0 0 12px}}p{{color:#66716B;line-height:1.7}}
          .note{{background:#fff;border:1px solid #D7DDD8;border-radius:18px;padding:18px;margin:24px 0}}
          .grid{{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}}
          .card{{display:grid;gap:7px;background:#fff;border:1px solid #D7DDD8;border-radius:17px;padding:18px;color:inherit;text-decoration:none}}
          .card small{{font-size:10px;font-weight:900;letter-spacing:.08em;color:#7A817D}}.card b{{font-size:15px}}.card span{{font-size:12px;color:#315F4C;font-weight:800}}
          @media(max-width:700px){{.grid{{grid-template-columns:1fr}}.wrap{{padding:36px 0}}}}
          </style></head><body><main class="wrap"><p>NETLIFY PREVIEW · 실제 Production renderer 산출물</p>
          <h1>V4.4 + Reader-first + 22개 검색의도</h1>
          <p>기존 13개 대표 페이지, 시험 학원 검색 페이지 5개, 영어회화학원·성인영어회화학원·직장인영어회화학원·왕초보영어회화 4개를 같은 Production 생성기에서 뽑았습니다.</p>
          <div class="note"><b>확인 포인트</b><p>시험별 색상 변화, 첫 화면의 가독성, 학원 검색 페이지의 비교 설명, 관리 과정, PC/모바일 반응형을 확인해주세요. 이 Preview는 검색엔진 색인을 막아두었습니다.</p></div>
          <div class="grid">{cards}</div></main></body></html>'''
          (out/'index.html').write_text(index,encoding='utf-8')
          (out/'_headers').write_text('/*\n  X-Robots-Tag: noindex, nofollow\n',encoding='utf-8')
          (out/'ACADEMY_PREVIEW_PAGES.json').write_text(json.dumps(academy_names,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Deploy isolated Netlify preview
        run: |
          netlify deploy \
            --dir=stage9-v44-preview \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --alias=stage9-v44-gold-preview | tee /tmp/netlify-preview.txt
          echo "PREVIEW_URL=https://stage9-v44-gold-preview--englishpt-seo.netlify.app" >> "$GITHUB_ENV"

      - name: Verify preview URL and representative pages
        run: |
          curl -fsSIL --max-time 30 "$PREVIEW_URL/" | head
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          q=json.loads(Path('stage7-source/stage7-preview/STAGE7_DEPLOY_PREVIEW_QA_V1.json').read_text(encoding='utf-8'))
          base='https://stage9-v44-gold-preview--englishpt-seo.netlify.app'
          names=[row['canonical'].rsplit('/',1)[-1] for row in q['representative_13']['pages']]
          names += json.loads(Path('stage9-v44-preview/ACADEMY_PREVIEW_PAGES.json').read_text(encoding='utf-8'))
          assert len(names)==22, len(names)
          for name in names:
              subprocess.run(['curl','-fsSIL','--max-time','30',f'{base}/{name}'],check=True,stdout=subprocess.DEVNULL)
          print('PASS_STAGE9_22_PAGE_READER_EXPANSION_PREVIEW')
          PY

      - name: Write preview report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report={
            "status":"PASS_STAGE9_22_PAGE_READER_EXPANSION_PREVIEW",
            "preview_url":"https://stage9-v44-gold-preview--englishpt-seo.netlify.app",
            "source":"exact current Stage 9 production renderer with exam-academy and conversation expansion intents",
            "production_affected":False,
            "representative_pages":22,
            "preview_indexing":"blocked by X-Robots-Tag only"
          }
          Path('STAGE9_V44_GOLD_PREVIEW_REPORT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage9-v44-gold-netlify-preview-report
          path: STAGE9_V44_GOLD_PREVIEW_REPORT.json
          retention-days: 30
