              time.sleep(1.2)
              result=tab.Runtime.evaluate(expression=expression,returnByValue=True)
              metrics=result['result']['value']
              shot=tab.Page.captureScreenshot(format='png',fromSurface=True,captureBeyondViewport=False)
              shot_path=Path('mobile-qa')/f'{i:02d}-{name}.png'
              shot_path.write_bytes(base64.b64decode(shot['data']))
