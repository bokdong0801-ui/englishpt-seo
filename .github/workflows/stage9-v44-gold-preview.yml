          nav('english-conversation.html',1.2)
          val("""document.querySelector('[data-region-preset="worker-english-conv-academy"]').click()""")
          time.sleep(0.3)
          assert val("document.querySelector('[data-region-intent]').value")=='worker-english-conv-academy'
          assert val("location.hash")=='#region'

          # Dobongsan hub -> TOEIC child page must resolve.
          nav('station-dobongsan.html')
          val("""document.querySelector('a[href="/station-dobongsan-toeic.html"]').click()""")
          time.sleep(0.7)
          path=val("location.pathname"); h1=val("document.querySelector('h1')?.innerText||''")
          assert path.endswith('/station-dobongsan-toeic.html'),(path,h1)
          assert '도봉산역' in h1 and '토익' in h1,(path,h1)

          # Preserved Songhyeondong page must connect into the nationwide generated graph.
          nav('dalseo-songhyeondong-adult-conv.html',1.2)
          assert val("!!document.querySelector('.preserved-region-navigation')")
          val("""(()=>{const e=document.querySelector('[data-region-sido]');e.value='대구광역시';e.dispatchEvent(new Event('change',{bubbles:true}));return true})()""")
          val("""(()=>{const e=document.querySelector('[data-region-jurisdiction]');e.value='대구광역시 달서구';e.dispatchEvent(new Event('change',{bubbles:true}));return true})()""")
          dongs=val("[...document.querySelector('[data-region-dong]').options].map(x=>x.value)")
          song=next((x for x in dongs if 'songhyeondong' in x),None)
          assert song,(dongs[:40])
          val(f"""(()=>{{document.querySelector('[data-region-dong]').value='{song}';document.querySelector('[data-region-intent]').value='toeic';document.querySelector('[data-region-go]').click();return true}})()""")
          time.sleep(0.8)
          path=val("location.pathname"); h1=val("document.querySelector('h1')?.innerText||''")
          assert path.endswith('-songhyeondong-toeic.html'),(path,h1)
          assert '송현동' in h1 and '토익' in h1,(path,h1)

          report={
            'status':'PASS_REAL_NAVIGATION_CLICK_QA',
            'home_to_sajik_toeic':True,
            'worker_course_to_region_finder':True,
            'dobongsan_to_toeic':True,
            'preserved_songhyeondong_to_generated_region':True,
          }
          Path('STAGE9_REAL_NAVIGATION_CLICK_QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          tab.stop();browser.close_tab(tab)
          PY

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Deploy isolated Netlify preview
        run: |
          netlify deploy \
            --dir=stage9-v44-preview \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --alias=stage9-v44-gold-preview | tee /tmp/netlify-preview.txt
          echo "PREVIEW_URL=https://stage9-v44-gold-preview--englishpt-seo.netlify.app" >> "$GITHUB_ENV"

      - name: Verify preview URL and representative pages
        run: |
          curl -fsSIL --max-time 30 "$PREVIEW_URL/" | head
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          q=json.loads(Path('stage7-source/stage7-preview/STAGE7_DEPLOY_PREVIEW_QA_V1.json').read_text(encoding='utf-8'))
          base='https://stage9-v44-gold-preview--englishpt-seo.netlify.app'
          names=[row['canonical'].rsplit('/',1)[-1] for row in q['representative_13']['pages']]
          names += json.loads(Path('stage9-v44-preview/ACADEMY_PREVIEW_PAGES.json').read_text(encoding='utf-8'))
          assert len(names)==23, len(names)
          names += ['courses.html','english-conversation.html','exam-english.html','student-english.html']
          names += ['stations.html','station-dobongsan.html','station-dobongsan-toeic.html','station-dobongsan-english-conv-academy.html','station-gangnam.html']
          for name in names:
              subprocess.run(['curl','-fsSIL','--max-time','30',f'{base}/{name}'],check=True,stdout=subprocess.DEVNULL)
          extra=[
              'station-dobongsan-opic.html','station-dobongsan-ielts.html',
              'station-dobongsan-toefl.html','station-dobongsan-duolingo.html',
              'daegu-dalseo-songhyeondong-toeic.html',
              'seoul-jongno-sajikdong-toeic.html',
              'busan-dongnae-sajikdong-english-conv-academy.html',
              'review-index.html'
          ]
          for name in extra:
              subprocess.run(['curl','-fsSIL','--max-time','30',f'{base}/{name}'],check=True,stdout=subprocess.DEVNULL)
          print('PASS_STAGE9_FULL_SITE_READER_PREVIEW')
          PY

      - name: Write preview report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report={
            "status":"PASS_STAGE9_FULL_SITE_READER_PREVIEW",
            "preview_url":"https://stage9-v44-gold-preview--englishpt-seo.netlify.app",
            "source":"exact current Stage 9 production renderer with national hubs and 911-station expansion",
            "production_affected":False,
            "representative_pages":23,
            "station_sample_pages":5,
            "full_site_html_deployed":140391,
            "locality_selector_rows":5149,
            "final_html_total":140391,
            "preview_indexing":"blocked by X-Robots-Tag only"
          }
          Path('STAGE9_V44_GOLD_PREVIEW_REPORT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage9-v44-gold-netlify-preview-report
          path: |
            STAGE9_V44_GOLD_PREVIEW_REPORT.json
            STAGE9_KEY_PAGE_QA_REPORT.json
            STAGE9_BEGINNER_READABILITY_QA.json
            STAGE9_MOBILE_FIRST_SCREEN_QA.json
            STAGE9_NATIONAL_HUB_RESPONSIVE_QA.json
            STAGE9_HOME_STATION_RESPONSIVE_QA.json
            mobile-qa/*.png
            hub-qa/*.png
            station-responsive-qa/*.png
          retention-days: 30
