name: V4.5 Pilot Render QA
on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'pilot-v45-5x7/**'
      - '.github/workflows/v45-pilot-render-qa.yml'
jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 >/tmp/englishpt-http.log 2>&1 &
          sleep 2
      - name: Run 35-page desktop/mobile render QA
        run: node pilot-v45-5x7/render-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v45-pilot-render-qa
          path: pilot-v45-5x7/PILOT_5X7_RENDER_QA_V2_FULL_DEPTH.json
