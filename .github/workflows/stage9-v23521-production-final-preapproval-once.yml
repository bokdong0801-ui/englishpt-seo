name: ENGLISH PT v23.5.2.1 FINAL Production Preapproval Readonly Gate NO DEPLOY
on:
  push:
    branches: [release/v23521-preapproval-freeze-20261017]
    paths: ['.github/workflows/stage9-v23521-production-final-preapproval-once.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: englishpt-v23521-preapproval-read-only-once
  cancel-in-progress: false
jobs:
  verify-all-prelaunch-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on missing candidate or unsafe source code
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v23521_prod_preapproval_final_gate.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/v23521_prod_preapproval_final_gate.py').read_text('utf8')
          assert 'method="GET"' in s and 'method="POST"' not in s
          assert 'netlify deploy' not in s and 'urlopen' in s
          assert 'e06c6a7b33a3042c9c52e73e95f1ed8a25819dde8584873f939fa14cff9c4bba' in s
          print('PASS_FROZEN_READONLY_NO_DEPLOY_NO_FORMS_POST',flush=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-JSFIX-PRODUCTION-READY-158571-NOT-DEPLOYED
          run-id: 38992648694
          path: verified-candidate-source
          github-token: ${{ github.token }}
      - name: Verify exact candidate archive and extract only six HTML, pilot.js, headers
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y zstd)
          FILE=verified-candidate-source/ENGLISHPT_v23.5.2.1_JSFIX_PRODUCTION_READY_NOT_DEPLOYED.tar.zst
          echo "e06c6a7b33a3042c9c52e73e95f1ed8a25819dde8584873f939fa14cff9c4bba  $FILE" | sha256sum -c -
          mkdir -p production-preapproval-sample
          tar --zstd -xf "$FILE" -C production-preapproval-sample \
            ./pilot.js ./_headers \
            ./gyeongnam-milyang-naeidong-elem-tutor.html \
            ./gyeongnam-milyang-naeidong-mid-tutor.html \
            ./gyeongnam-milyang-naeidong-high-tutor.html \
            ./seoul-jongno-sajikdong-elem-tutor.html \
            ./seoul-jongno-sajikdong-mid-tutor.html \
            ./seoul-jongno-sajikdong-high-tutor.html
          echo PASS_SOURCE_FULL_ARCHIVE_SHA_AND_SIX_HTML_SAMPLES
      - name: Recheck original Netlify Production published deploy and actual six form definitions
        run: |
          set -euo pipefail
          python3 scripts/v23521_prod_preapproval_final_gate.py \
            --candidate production-preapproval-sample \
            --output production-preapproval-report/FINAL_PREAPPROVAL_GO_HOLD.json
      - name: Upload independent final preapproval evidence on PASS or HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23521-final-production-preapproval-restore-form-credits-qa
          path: production-preapproval-report/
          retention-days: 30
          if-no-files-found: warn
