name: ENPT V3.1 Seven Locality Page Text Repair Offline Source QA
on:
  push:
    branches: [review/enpt-v3-1-byeongmokandong-fix-20261027]
    paths: [.github/workflows/enpt-v3-1-7-locality-offline-qa.yml]
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_V3_READONLY_FULL_PUBLISHED_SHA_FILE_MANIFEST
          run-id: 40459650646
          github-token: ${{ github.token }}
          path: published-manifest
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-NAVER-TAG-PRESERVE-GOOGLE-180800-FULL-QA
          run-id: 39234109195
          github-token: ${{ github.token }}
          path: signed-qa-map
      - name: Reproduce exact V3 202786 manifest, then fix ONLY 7 broken 읍면동 text pages
        run: |
          set -euo pipefail
          python3 scripts/ENPT_REGION_DRAFT_BUILD_20261027.py
          python3 scripts/ENPT_REGION_FINAL_INTEGRATION_20261027.py
          python3 scripts/ENPT_REGION_V2_FIX_5149_LINKS_20261027.py
          python3 scripts/ENPT_V3_SHA_REUSE_MINIMAL_FULLSITE_BUILDER_20261027.py
          python3 scripts/ENPT_V3_1_FIX_7_LOCALITY_TITLES_ONLY_20261027.py
          test -s v3-1-patch-evidence/V3_1_202786_CANDIDATE_FILES_SHA1.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENPT_V3_1_7_LOCALITY_TITLE_SOURCE_SAFE_QA_NO_DEPLOY
          path: v3-1-patch-evidence/
          retention-days: 30
