name: ENGLISH PT BUILD tiny real Edge Draft Diagnostic without Netlify upload
on:
  push:
    branches: [ops/v23521-small-preview-diagnostic-offline-20261019]
    paths: ['.github/workflows/stage9-v23521-SMALL-draft-diagnostic-build-NO-DEPLOY-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  build-small-fail-fast-diagnostic-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure builder is OFFLINE and does not deploy
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v23521_small_shard_diagnostic_pack_OFFLINE_ONLY.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/v23521_small_shard_diagnostic_pack_OFFLINE_ONLY.py').read_text('utf8')
          assert 'api.netlify.com' not in s and 'urllib' not in s and 'netlify deploy' not in s
          assert 'X-Robots-Tag: noindex' in s
          print('PASS_ZERO_NETLIFY_UPLOAD_OR_PRODUCTION_ACTIONS',flush=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-SHARDED-EDGE-FULL-158571-CANDIDATE-NO-DRAFT-NO-PROD
          run-id: 39194321977
          github-token: ${{ github.token }}
          path: original
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-actual-sharded-all-files-SEO-sitemap-OG-Forms-QA-and-frozen-SHA
          run-id: 39194321977
          github-token: ${{ github.token }}
          path: mapping
      - name: Generate small real Edge diagnostic candidate - no Netlify uploads
        run: |
          set -euo pipefail
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -qq -y zstd)
          python3 scripts/v23521_small_shard_diagnostic_pack_OFFLINE_ONLY.py \
            --input original/ENGLISHPT_v23.5.2.1_SHARDED_EDGE_NEW_CANDIDATE_NOT_DEPLOYED.tar.zst \
            --source-map mapping/ORIGINAL_TO_SHARDED_ALL_FILE_SHA1_MAP.json.gz \
            --output small-edge-pilot/ENGLISHPT_SMALL_SHARDED_EDGE_PILOT_NOINDEX_NOT_DEPLOYED.tar.zst \
            --report small-edge-pilot/SMALL_EDGE_DRAFT_DIAGNOSTIC_BUILD_REPORT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('small-edge-pilot/SMALL_EDGE_DRAFT_DIAGNOSTIC_BUILD_REPORT.json').read_text('utf8'))
          assert r['status']=='PASS_SMALL_DIAGNOSTIC_DRAFT_CANDIDATE_BUILT_OFFLINE'
          assert r['six_student_tutors_present'] and r['pilot_global_header_noindex']
          assert r['kept_original_root_page_samples']>=100
          assert r['pilot_archive_bytes']<150_000_000
          print('PASS_ACTUAL_SMALL_PILOT_SHA256_WITH_GLOBAL_NOINDEX_AND_FORMS',r['pilot_sha256'],flush=True)
          PY
      - name: Save pilot report even if build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23521-SMALL-Edge-Draft-PILOT-BUILD-REPORT-NO-DEPLOY
          path: small-edge-pilot/SMALL_EDGE_DRAFT_DIAGNOSTIC_BUILD_REPORT.json
          retention-days: 30
          if-no-files-found: warn
      - name: Save actual small diagnostic candidate ONLY after complete verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23521-SMALL-Edge-Draft-PILOT-NOINDEX-NOT-DEPLOYED
          path: small-edge-pilot/ENGLISHPT_SMALL_SHARDED_EDGE_PILOT_NOINDEX_NOT_DEPLOYED.tar.zst
          retention-days: 30
          if-no-files-found: error
