name: ENPT 21964 Async Digest Nonpublished Draft Required SHA Next 1200
on:
  push:
    branches:
      - ops/v23521-OG21964-ASYNC-DIGEST-DRAFT-ONLY-ONCE-20261020
    paths:
      - .github/workflows/ENPT-21964-ASYNC-DRAFT-REQUIRED-SNAPSHOT-NEXT1200.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: enpt-21964-existing-async-draft-sha-replay-capped-one-at-a-time
  cancel-in-progress: false
jobs:
  required-sha-next-1200:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      BATCH_SIZE: 1200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static no-new-deploy guard and code compilation
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ENPT_21964_ASYNC_SHA_SNAPSHOT_RESUME_BATCH.py
          python3 -m py_compile scripts/ENPT_21964_ASYNC_DRAFT_REQUIRED_SHA_BOUNDED_FIRST_BATCH.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/ENPT_21964_ASYNC_SHA_SNAPSHOT_RESUME_BATCH.py').read_text()
          assert "BATCH=int(os.environ.get('BATCH_SIZE','1000'))" in s
          assert "if not (1<=BATCH<=1500)" in s
          assert "DRAFT='6ad708da374d457504481d5c'" in s
          assert "PROD='6ad5eb4918f9411c4d5e1ba4'" in s
          assert "method='POST'" not in s and "/restore" not in s
          assert "max_workers=8" in s
          print('PASS_EXISTING_NONPUBLISHED_DRAFT_ONLY_NO_NEW_DEPLOY_ONE_BATCH',flush=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_21964_ASYNC_DIGEST_20600_REQUIRED_SHA_CATEGORIES_NO_UPLOAD
          run-id: 39380353473
          github-token: ${{ github.token }}
          path: required-snapshot
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_21964_ASYNC_EXISTING_DRAFT_FIRST_200_SHA_BOUNDED_TRANSFER_QA
          run-id: 39380807594
          github-token: ${{ github.token }}
          path: first200-snapshot
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_21964_REAL_ALL_SHA256_HASH_NONPUBLISHED_ASYNC_DIGEST_ONE_SHOT
          run-id: 39379746225
          github-token: ${{ github.token }}
          path: prior-digest
      - uses: actions/download-artifact@v4
        with:
          name: ENPT_SIGNED_21964_URL_THUMBNAIL_MAPPING_AND_150_REAL_SQUARE_JPEG_PILOT_V2
          run-id: 39360145172
          github-token: ${{ github.token }}
          path: signed-route-map
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-NAVER-TAG-PRESERVE-GOOGLE-180800-FULL-QA
          run-id: 39234109195
          github-token: ${{ github.token }}
          path: signed-qa-map
      - name: Use original 20600 required SHA snapshot and 200 signed success list to select next 1200 only
        run: |
          set -euo pipefail
          python3 scripts/ENPT_21964_ASYNC_SHA_SNAPSHOT_RESUME_BATCH.py select
          test "$(wc -l < resumable-sha-evidence/WANTED_ORIGINAL_PATHS.txt)" -eq 1200
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-NAVER-GOOGLE-TAGS-2HOMES-FULL-CANDIDATE-NOT-DEPLOYED
          run-id: 39234109195
          github-token: ${{ github.token }}
          path: signed-original
      - name: Verify original 180800 member full release SHA and extract requested 1200 original sharded pages only
        run: |
          set -euo pipefail
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
          ARCHIVE=signed-original/ENGLISHPT_v23521_NAVER_GOOGLE_META_ONLY_TWO_HOME_NOT_DEPLOYED.tar.zst
          printf '%s  %s\n' 6d0272d1601a1a47abeccc4d740359af9e7678293ee0a3d257eecd2ca478d884 "$ARCHIVE" | sha256sum -c -
          mkdir -p resumable-original
          tar --zstd -xf "$ARCHIVE" -C resumable-original -T resumable-sha-evidence/WANTED_ORIGINAL_PATHS.txt
          test -d resumable-original/__pages
          echo "PASS_EXTRACT_ONLY_1200_EXISTING_SEO_PAGE_SOURCE_NO_JPEG"
      - name: PUT only these exact 1200 signed page bytes once to existing nonpublished Draft, journal each 25
        run: |
          set -euo pipefail
          python3 scripts/ENPT_21964_ASYNC_SHA_SNAPSHOT_RESUME_BATCH.py upload
      - name: Preserve file transfer progress, no site snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENPT_21964_ASYNC_DIGEST_NEXT_1200_SHA_CHECKPOINT_AND_QA
          path: resumable-sha-evidence/
          retention-days: 30
          if-no-files-found: warn
