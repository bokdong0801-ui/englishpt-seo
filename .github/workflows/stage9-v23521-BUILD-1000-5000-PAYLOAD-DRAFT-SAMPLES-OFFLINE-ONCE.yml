name: ENGLISH PT Build actual 1000+5000 page payload benchmark sites OFFLINE
on:
  push:
    branches: [ops/v23521-PAYLOAD-MID-SCALE-1000-5000-REVIEW-20261019]
    paths: ['.github/workflows/stage9-v23521-BUILD-1000-5000-PAYLOAD-DRAFT-SAMPLES-OFFLINE-ONCE.yml']
permissions:
  contents: read
  actions: read
jobs:
  make-two-real-subsets-not-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check no Netlify operations and exact frozen source
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v23521_payload_edge_scaled_review_sample_builder_offline.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/v23521_payload_edge_scaled_review_sample_builder_offline.py').read_text('utf8')
          assert 'urllib' not in s and 'api.netlify.com' not in s and 'netlify deploy' not in s
          assert '0f72556e20ed2e22b45f144b4ccf687937e1b15cedc4d2dd109819fef65db7e8' in s
          print('PASS_OFFLINE_BENCHMARK_PACKAGE_BUILDER_NO_SITE_WRITES',flush=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-FULL-158571-PAYLOAD-EDGE-4-STATIC-HTML-NOT-DEPLOYED
          run-id: 39210125229
          github-token: ${{ github.token }}
          path: full-source
      - uses: actions/download-artifact@v4
        with:
          name: englishpt-v23521-full-payload-180800-SEO-Forms-OG-SHA1-QA
          run-id: 39210125229
          github-token: ${{ github.token }}
          path: signed-qamap
      - name: Generate complete offline scaled 1000+5000 page subsets, preserve Forms and noindex
        run: |
          set -euo pipefail
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
          python3 scripts/v23521_payload_edge_scaled_review_sample_builder_offline.py \
            --source full-source/ENGLISHPT_v23.5.2.1_FULL_158571_PAYLOAD_EDGE_NEW_NOT_DEPLOYED.tar.zst \
            --source-map signed-qamap/FULL_PAYLOAD_ORIGINAL_TO_FILE_SHA1_MAP.json.gz \
            --output-dir staged-benchmarks
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('staged-benchmarks/SCALING_STAGE_1000_5000_QA.json').read_text('utf8'))
          assert r['status']=='PASS_1000_AND_5000_REAL_PAYLOAD_STAGE_SAMPLE_CREATED'
          for n in ('1000','5000'):
              q=r['reports'][n]
              assert q['sampled_full_public_urls']==int(n)
              assert q['Netlify_payload_files']==int(n)
              assert q['Netlify_static_HTML']==4
              assert q['total_regular_files']<int(n)+5000
              assert q['globally_noindex_as_Draft_only']
              assert q['sample_tar_bytes']<150000000
          print('PASS_1000_AND_5000_SMALL_REAL_PAYLOAD_DRAFT_BENCHMARK_SAMPLES',json.dumps(r),flush=True)
          PY
      - name: Upload both benchmarks together and QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23521-PAYLOAD-REAL-1000-AND-5000-REVIEW-DRAFT-BENCHMARK-NO-DEPLOY
          path: staged-benchmarks/
          retention-days: 30
          if-no-files-found: error
      - name: Upload verification report even if candidate saving fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: englishpt-v23521-PAYLOAD-1000-5000-OFFLINE-QA-REPORT
          path: staged-benchmarks/SCALING_STAGE_1000_5000_QA.json
          retention-days: 30
          if-no-files-found: warn
