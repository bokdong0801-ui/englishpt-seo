name: Stage 9 Final User Five Preview

on:
  push:
    branches:
      - reset-english-service-seo-v3
    paths:
      - 'stage9-final-five-trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || secrets.ENGLISHPT_NETLIFY_SITE_ID || vars.NETLIFY_SITE_ID || vars.ENGLISHPT_NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify preview credentials
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"

      - name: Download latest proven 13-page production sample
        uses: actions/download-artifact@v4
        with:
          name: stage9-final-ux-samples
          path: stage9-source
          run-id: 36967098337
          github-token: ${{ github.token }}

      - name: Build five reader-first exam pages
        run: |
          python3 scripts/build-final-user-five-preview.py \
            --source stage9-source \
            --output stage9-final-five
          test "$(find stage9-final-five -maxdepth 1 -name 'seoul-jongno-sajikdong-*.html' | wc -l)" -eq 5
          python3 - <<'PY'
          from pathlib import Path
          wanted=['ielts','opic','toeic','toeic-speaking','toefl']
          for x in wanted:
              p=Path('stage9-final-five')/f'seoul-jongno-sajikdong-{x}.html'
              raw=p.read_text(encoding='utf-8')
              for token in ['class="five-hero"','class="quick-grid"','class="section five-manage"','class="after-grid"','class="choice-grid"','id="consultation-preview"']:
                  assert token in raw,(p.name,token)
              assert 'AI' not in raw
              assert 'X-Robots' not in raw
          print('PASS_FINAL_USER_FIVE_BUILD')
          PY

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Deploy isolated five-page preview
        run: |
          netlify deploy \
            --dir=stage9-final-five \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" | tee /tmp/netlify-final-five.txt

      - name: Resolve immutable Netlify deploy URL
        run: |
          DEPLOY_ID=$(sed -n 's/.*deployId: //p' /tmp/netlify-final-five.txt | tail -1 | tr -d '\r')
          test -n "$DEPLOY_ID"
          curl -fsS \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" > /tmp/deploy-meta.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/deploy-meta.json'))
          print(json.dumps({k:d.get(k) for k in ['id','state','deploy_url','deploy_ssl_url','url','ssl_url','published_at']},ensure_ascii=False))
          url=d.get('deploy_ssl_url') or d.get('deploy_url')
          assert url
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('IMMUTABLE_PREVIEW_URL='+url+'\n')
          PY

      - name: Verify immutable preview and five pages
        run: |
          echo "Verifying $IMMUTABLE_PREVIEW_URL"
          ok=0
          for attempt in 1 2 3 4 5; do
            if curl -fsSIL --max-time 30 "$IMMUTABLE_PREVIEW_URL/" >/dev/null; then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
          for x in ielts opic toeic toeic-speaking toefl; do
            curl -fsSIL --max-time 30 "$IMMUTABLE_PREVIEW_URL/seoul-jongno-sajikdong-$x.html" >/dev/null
          done
          echo "PASS_STAGE9_FINAL_USER_FIVE_PREVIEW"

      - name: Write preview report
        run: |
          python3 - <<'PY'
          import json, os
          report={
            "status":"PASS_STAGE9_FINAL_USER_FIVE_PREVIEW",
            "preview_url":os.environ["IMMUTABLE_PREVIEW_URL"],
            "scope":["ielts","opic","toeic","toeic-speaking","toefl"],
            "production_affected":False,
            "next_step":"user review before expanding structure to all 67032 pages"
          }
          open('FINAL_USER_FIVE_PREVIEW_REPORT.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage9-final-user-five-preview-report
          path: FINAL_USER_FIVE_PREVIEW_REPORT.json
          retention-days: 30
